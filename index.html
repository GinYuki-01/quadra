<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadra</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M6%2026h20M6%2026V6%22%20stroke%3D%22%232f2f33%22%20stroke-width%3D%222%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M16%2026V10M6%2016h10%22%20stroke%3D%22%23d5d5d1%22%20stroke-width%3D%221.4%22%20fill%3D%22none%22%2F%3E%3Ccircle%20cx%3D%2222%22%20cy%3D%2211%22%20r%3D%224%22%20fill%3D%22%235E7A94%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --line:#2f2f33;
  --line-2:#d5d5d1;
  --line-3:#ececea;
  --ink:#1e1e22;
  --ink-2:#65656a;
  --ink-3:#9c9c9f;
  --r:5px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
input[type=text],input[type=date]{
  border:1px solid var(--line-2);border-radius:var(--r);padding:5px 8px;background:#fff
}
input[type=text]:focus,input[type=date]:focus{outline:none;border-color:var(--ink)}

header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 16px;border-bottom:1.5px solid var(--line)
}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);flex:none}
.brand b{font-weight:500;color:var(--ink);letter-spacing:.12em;font-size:14px}
.mk{width:19px;height:19px;display:block}
.hdr{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);
  flex-wrap:nowrap;min-width:0}
.hsep{width:1px;height:16px;background:var(--line-2);flex:none;margin:0 3px}
.ib{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:var(--r);
  padding:4px 9px;color:var(--ink-2);flex:none;white-space:nowrap;transition:all .12s}
.ib svg{width:15px;height:15px;flex:none}
.ib:hover{background:#f4f4f2;color:var(--ink);border-color:var(--ink-2)}
.ib:active{transform:scale(.97)}
.ib.key{border-color:var(--ink-2);color:var(--ink)}
.ib.key:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.ib.dev{border-color:transparent;padding:4px 5px;color:var(--ink-3)}
.ib.dev:hover{border-color:var(--line-2);color:var(--ink)}
.hdr .lb{font-size:11.5px}
header.lv1 .hdr .lb{display:none}
header.lv1 .ib{padding:5px 7px}
header.lv2 .hdr .lb{display:none}
header.lv2 .ib{padding:5px 7px}
header.lv2 #saveTx{display:none}
header.lv3 .hdr .lb{display:none}
header.lv3 .ib{padding:5px 7px}
header.lv3 #saveTx{display:none}
header.lv3 .hsep{display:none}
header.lv3 #expBtn,header.lv3 #impBtn{display:none}
header.lv4 .hdr .lb{display:none}
header.lv4 .ib{padding:5px 7px}
header.lv4 #saveTx{display:none}
header.lv4 .hsep{display:none}
header.lv4 #expBtn,header.lv4 #impBtn{display:none}
header.lv4 .ib.dev{display:none}
.clock{font-variant-numeric:tabular-nums;letter-spacing:.03em;white-space:nowrap;flex:none;padding:0 3px}
.save-st{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);
  flex:0 1 auto;min-width:0;overflow:hidden}
#saveTx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.save-st i{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:background .3s}
.save-st.ok i{background:#7C9478}
.save-st.local i{background:#BA8B4F}
.save-st.busy i{background:#5E7A94}

.btn{border:1px solid var(--ink-2);border-radius:var(--r);padding:3px 10px;font-size:11.5px;color:var(--ink-2)}
.btn:hover{background:#f4f4f2;color:var(--ink);border-color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.pri{border-color:var(--line);color:var(--ink)}
.btn.sm{padding:2px 8px;font-size:11px}

.wrap{padding:12px 16px 30px;max-width:1720px;margin:0 auto;min-width:0}
.top{display:grid;grid-template-columns:minmax(360px,1fr) minmax(400px,1fr);gap:12px;align-items:stretch;min-width:0}
.top > *{min-width:0}
@media(max-width:1060px){.top{grid-template-columns:1fr}}

.panel{border:1.5px solid var(--line);border-radius:var(--r);background:#fff;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border-bottom:1px solid var(--line-2);flex:none}
.pt{font-size:11px;letter-spacing:.12em;color:var(--ink-2);text-transform:uppercase}
.cnt{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pb{padding:9px 11px;overflow:auto;min-height:0}

.mxwrap{position:relative;padding:8px;flex:1 1 auto;min-height:200px;display:flex;min-width:0;overflow:hidden}
@media(max-width:1060px){
  .mxwrap{flex:0 0 auto;aspect-ratio:1/1;max-height:58vh;min-height:260px}
  svg.mx{width:auto;max-width:100%}
}
svg.mx{display:block;width:100%;height:100%;margin:0 auto;min-width:0;min-height:0}
.dot{cursor:pointer;transition:opacity .12s}
.dot:hover{opacity:.7}
.dim{opacity:.2}
#tip{position:absolute;display:none;pointer-events:none;z-index:30;background:#fff;
  border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;max-width:240px;
  box-shadow:0 3px 12px rgba(0,0,0,.09)}
#tip .a{font-weight:500;font-size:12.5px}
#tip .b{font-size:11px;color:var(--ink-2)}
#tip .c{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.sdband{display:none;align-items:flex-start;gap:11px;padding:9px 11px;flex:none;
  border-top:1px solid var(--line-2);background:#fafaf8}
.sdband.on{display:flex}
.sdlab{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);
  white-space:nowrap;letter-spacing:.04em;padding-top:2px}
.sdlab::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--ink-2);opacity:.5}
.sdlab .n{font-size:10.5px;color:#fff;background:var(--ink-2);border-radius:99px;
  padding:0 6px;font-variant-numeric:tabular-nums}
.sddots{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.sdchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line-2);border-radius:99px;padding:2px 10px 2px 7px;
  cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:border-color .12s,box-shadow .12s}
.sdchip:hover{border-color:var(--ink-2);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sdchip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sddot{width:7px;height:7px;border-radius:50%;flex:none}
.sdmark{font-size:10px;color:var(--ink-2);background:#f0efec;border-radius:99px;
  padding:1px 7px;white-space:nowrap;flex:none;letter-spacing:.02em}
.key{display:flex;gap:16px;padding:7px 11px;border-top:1px solid var(--line-3);font-size:11px;color:var(--ink-2);flex-wrap:wrap;flex:none}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:8px 11px;border-top:1px solid var(--line-3);flex:none;max-height:118px;overflow:auto;min-width:0}
.lg{min-width:0}
.lg span:not(.sw):not(.n){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1060px){.legend{grid-template-columns:1fr}}
.legend:empty{display:none}
.lg{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;padding:1px 0}
.lg.off{color:var(--ink-3)}
.lg .sw{width:9px;height:9px;border-radius:2px;flex:none}
.lg.off .sw{opacity:.28}
.lg .n{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.right{display:flex;flex-direction:column;gap:12px;min-height:0}
#nowP{flex:none}
#taskP{flex:1;min-height:120px}
#waitP{flex:none}

.now-i{display:flex;align-items:center;gap:9px;padding:4px 0 4px 9px;border-left:3px solid var(--line-2)}
.now-t{font-size:13px;font-weight:500}
.now-m{font-size:11px;color:var(--ink-3)}
.pill{margin-left:auto;font-size:10.5px;color:var(--ink-2);border:1px solid var(--line-2);
  border-radius:99px;padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.pill.hot{border-color:#b98d8d;color:#8f5252}

.par{border-left:3px solid var(--line-2);padding-left:9px;margin-bottom:11px}
.par-h{display:flex;align-items:center;gap:8px;padding:1px 0}
.par-h.pdone .par-t{text-decoration:line-through;color:var(--ink-3)}
.par-h.pdone .rep{color:var(--ink-3)}
.par-t{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.par-h .x{font-size:11px;color:var(--ink-3);opacity:0}
.par-h:hover .x{opacity:1}
.par-h .add{margin-left:auto;font-size:11px;color:var(--ink-3)}
.dn .tr{margin-left:auto}
.par-h:hover .add{color:var(--ink)}

.ch{display:flex;align-items:center;gap:8px;padding:2.5px 0 2.5px 11px}
.box{width:12.5px;height:12.5px;border:1.2px solid var(--ink-2);border-radius:2px;flex:none;
  display:grid;place-items:center;cursor:pointer}
.box.on{background:var(--ink);border-color:var(--ink)}
.box.on::after{content:"";width:5px;height:2.5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ch-t{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ch.done .ch-t{text-decoration:line-through;color:var(--ink-3);font-size:11px}
.ch.done .box{opacity:.4}
.ch .u{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.ch.sel{background:#f4f4f2;border-radius:3px}
.ch .wm{width:8px;height:8px;border-radius:50%;border:1.5px solid;flex:none}
.nowbtn{font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:99px;padding:0 6px;flex:none;opacity:0}
.ch:hover .nowbtn{opacity:1}
.nowbtn.on{opacity:1;color:var(--ink);border-color:var(--ink)}
.tr{display:grid;place-items:center;width:19px;height:19px;border-radius:3px;flex:none;opacity:0;color:var(--ink-3)}
.ch:hover .tr,.par-h:hover .tr,.dn:hover .tr,.st:hover .tr{opacity:1}
.tr:hover{background:#f2eaea;color:#9a5252}
.tr svg{pointer-events:none}

.inline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 0 6px 11px}
.inline input[type=text]{flex:1 1 130px;min-width:0}
.inline .lab{font-size:11px;color:var(--ink-3)}
.sl{display:flex;align-items:center;gap:5px}
.sl input{width:78px}
.sl b{font-weight:500;font-variant-numeric:tabular-nums;width:14px;font-size:11.5px}
.cb{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}

.wt{display:flex;align-items:center;gap:8px;padding:2.5px 0}
.wt .d{width:9px;height:9px;border-radius:50%;border:1.6px solid;flex:none}
.wt .t{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt .e{font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:2px}
.tab{font-size:11px;letter-spacing:.06em;color:var(--ink-3);padding:2px 9px;border-radius:99px}
.tab.on{color:var(--ink);background:#f0f0ee}

.arow{display:flex;align-items:center;gap:9px;padding:3px 0;border-bottom:1px solid var(--line-3)}
.arow .d{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;width:42px;flex:none}
.arow .t{font-size:12px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .apar{font-size:10.5px;color:var(--ink-3);flex:none;max-width:30%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.arestore{font-size:10.5px;color:var(--ink-3);opacity:0;flex:none;padding:1px 6px;border-radius:99px}
.arow:hover .arestore{opacity:1}
.arestore:hover{color:var(--ink);background:#f2f2f0}

.dirs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);margin-top:12px}
@media(max-width:900px){
  .dirs{grid-template-columns:1fr}
  .dtree{border-right:none;border-bottom:1px solid var(--line-2);max-height:420px}
}
.dtree{padding:9px 11px;border-right:1px solid var(--line-2);max-height:560px;min-height:300px;
  overflow-y:auto;overflow-x:hidden;min-width:0}
.ddet{padding:9px 13px;overflow:auto}
.dn{display:flex;align-items:center;gap:8px;padding:5px 8px;cursor:pointer;border-radius:4px;
  position:relative;transition:background .12s;min-width:0}
.dn .fn,.dn .en{flex:1 1 auto}
.dn .cnum,.dn .cvt,.dn .ficon,.dn .dcol{flex:none}
.dn:hover{background:#f7f7f5}
.dn.sel{background:#f0f0ed}
.dn .cv{font-size:8px;color:var(--ink-3);width:10px;flex:none;transition:transform .15s}
.dn.folder{margin-top:5px}
.dn .fn{font-weight:500;font-size:13px;color:var(--ink);letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dn.hidden::before{content:"";width:11px;height:9px;flex:none;border-radius:1.5px 2px 2px 2px;
  border:1.2px solid var(--ink-3);border-top-width:3px;margin-right:-1px}
.dn.entry{position:relative}

.dn .en{font-size:12px;color:var(--ink-2);font-family:ui-monospace,Menlo,monospace;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dn.sel .en{color:var(--ink);font-weight:500}
.dn .x{font-size:10.5px;color:var(--ink-3);opacity:0;white-space:nowrap;padding:1px 4px;border-radius:3px}
.dn .ax{opacity:.35}
.dn:hover .ax{opacity:1}
.axi{display:none;font-size:12px;line-height:1}
@media(max-width:1120px){
  .dn .axl{display:none}
  .dn .axi{display:inline}
  .dn .ax{padding:1px 5px;border:1px solid var(--line-3);border-radius:4px}
}
.dn:hover .x{opacity:1}
.dn .x:hover{color:var(--ink);background:#eceae6}
.dn .x[data-af]{margin-left:auto}

.dn.folder .cnum{margin-right:2px}
.dn .x{flex:none}
.dn.entry .tr{margin-left:auto}
.rep{font-size:10px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:99px;padding:0 7px;white-space:nowrap}
.sortsel{border:1px solid var(--line-2);border-radius:var(--r);padding:2px 6px;
  font-size:11px;color:var(--ink-2);background:#fff}
.foldall{font-size:10.5px;color:var(--ink-3);opacity:1;white-space:nowrap;padding:2px 7px;
  border-radius:99px;border:1px solid transparent}
.foldall:hover{color:var(--ink);border-color:var(--line-2)}
.phx{gap:8px}
.phx .tabs{margin-left:auto}
.pcv{font-size:9px;color:var(--ink-3);width:11px;flex:none;cursor:pointer;transition:color .12s}
.pcv:hover{color:var(--ink)}
.pcount{font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:99px;
  padding:0 6px;font-variant-numeric:tabular-nums;flex:none}
.grip{color:var(--ink-3);font-size:12px;cursor:grab;letter-spacing:-1px;flex:none;opacity:.45}
.grip:active{cursor:grabbing}
.grip.sm{font-size:10px}
.par-h:hover .grip,.ch:hover .grip{opacity:1}
.par-h:hover .editbtn{opacity:1}
.par-h[draggable],.ch[draggable]{cursor:default}
.drop{box-shadow:inset 0 2px 0 -1px var(--ink)}
.st{display:flex;align-items:center;gap:7px;padding:1.5px 0 1.5px 34px}
.st .stt{font-size:12px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.done .stt{text-decoration:line-through;color:var(--ink-3);font-size:10.5px}
.stbox{width:10px;height:10px;border:1px solid var(--line-2);border-radius:2px;flex:none;cursor:pointer;
  display:grid;place-items:center}
.stbox.on{background:var(--ink-3);border-color:var(--ink-3)}
.st.done .stbox{opacity:.4}
.st .tr{width:17px;height:17px;margin-left:2px}
.st .tr svg{width:11px;height:11px}
.stedit{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:var(--r);
  padding:2px 7px;font-size:12px;background:#fff}
.stedit:focus{outline:none;border-color:var(--ink)}
.stt{cursor:pointer}
.st:hover .stt{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}
.st.done:hover .stt{text-decoration:line-through}
.stmore{display:flex;align-items:center;gap:7px;padding:2px 0 3px 34px;font-size:10.5px;
  color:var(--ink-3);cursor:pointer;user-select:none}
.stmore:hover{color:var(--ink-2)}
.stmore .dots{letter-spacing:1px;font-size:9px;color:var(--line-2)}
.stmore:hover .dots{color:var(--ink-3)}
.stadd{padding-left:34px}
.stadd input{flex:1 1 120px;min-width:0}
.waitbtn{font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:99px;
  padding:0 6px;flex:none;opacity:0}
.st:hover .waitbtn{opacity:1}
.waitbtn.on{opacity:1;color:var(--ink);border-color:var(--ink)}
.wm.sm{width:7px;height:7px}
.ch .wm.sub{border-style:dotted}
.wt .sub{color:var(--ink-3);font-size:11px}
.st .u{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.stepn{font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:99px;
  padding:0 5px;flex:none;font-variant-numeric:tabular-nums}
.editbtn{font-size:10.5px;color:var(--ink-3);flex:none;opacity:0}
.ch:hover .editbtn{opacity:1}
.editbtn:hover{color:var(--ink)}
.mq-on::-webkit-scrollbar{display:none}
.editbar{background:#fafaf8;border-radius:var(--r);margin:2px 0 4px}
.par-t,.ch-t{cursor:pointer}
.par-t:hover{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.ch-t:hover{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.repbar{padding-top:0;border-top:1px dashed var(--line-3);margin-top:2px}
.repbar select{border:1px solid var(--line-2);border-radius:var(--r);padding:3px 6px;background:#fff}
.pathbox{width:100%;border:1px solid var(--line-2);border-radius:var(--r);padding:5px 8px;
  font-family:ui-monospace,Menlo,monospace;font-size:11.5px;margin:2px 0 9px;background:#fafafa}
.dph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:6px}
.dph .pt{flex:none}
.dph .vtog{flex:none;margin-left:auto}
.dph .ff{flex:none}
.dph .sortsel{flex:none}
.dn[draggable]{cursor:pointer}
.drop-into{background:#e8edf1;box-shadow:inset 0 0 0 1.5px var(--ink)}

<script>
const DAY = 86400000;
/* ---------- 設定 ---------- */
const SETTINGS_DEF = [
  {group:'表示', items:[
    {key:'startCollapsed', type:'bool', label:'起動時に親タスクを閉じておく',
     hint:'開いた直後は見出しだけを並べる', def:false},
    {key:'archiveAfter', type:'select', label:'完了タスクをしまうまで', def:1,
     hint:'進行中から消えてアーカイブへ移る',
     options:[[1,'翌日'],[3,'3日後'],[7,'7日後'],[0,'自動でしまわない']]},
  ]},
  {group:'動作', items:[
    {key:'dayStart', type:'select', label:'1日の区切り', def:9,
     hint:'この時刻を過ぎると翌日として扱う',
     options:[[4,'4時'],[5,'5時'],[6,'6時'],[7,'7時'],[8,'8時'],[9,'9時'],[10,'10時'],[0,'0時']]},
    {key:'lockAfter', type:'select', label:'自動で施錠するまで', def:15,
     hint:'操作がないまま経過したら画面を隠す',
     options:[[5,'5分'],[10,'10分'],[15,'15分'],[30,'30分'],[60,'60分'],[0,'しない']]},
    {key:'horizon', type:'select', label:'緊急度の地平', def:30,
     hint:'締切がこれ以上先なら緊急度は最小',
     options:[[14,'14日'],[30,'30日'],[60,'60日'],[90,'90日']]},
    {key:'nodueDays', type:'select', label:'期限なしが上りきる日数', def:7,
     hint:'連絡日からこの日数で緊急度が最大に近づく',
     options:[[3,'3日'],[5,'5日'],[7,'7日'],[14,'14日'],[30,'30日']]},
  ]},
];

let settings = {};
let cfgDraft = null;
function defaultSettings(){
  const o = {};
  SETTINGS_DEF.forEach(g => g.items.forEach(i => o[i.key] = i.def));
  return o;
}
function setting(k){ return settings[k] !== undefined ? settings[k] : defaultSettings()[k]; }


const MIN_U = 12, NODUE_BASE = 25, NODUE_CAP = 85;
const COLORS = ['#2F5D8C','#A8562F','#3F7A52','#6B5CA5','#B24A63','#A8862B','#2A7F87','#5B5B5E'];
let offset = 0;

const now = () => new Date(Date.now() + offset * DAY);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => { const d = now(); d.setHours(d.getHours() - setting('dayStart')); return ymd(d); };
const atDayStart = s => { const d = new Date(s + 'T00:00:00'); d.setHours(setting('dayStart')); return d; };

function copyText(t){
  return new Promise(res => {
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(t).then(() => res(true)).catch(() => res(legacyCopy(t)));
    } else res(legacyCopy(t));
  });
}
function legacyCopy(t){
  try{
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

const FREQ = {daily:'毎日', weekly:'毎週', monthly:'毎月', yearly:'毎年'};
const WD = ['日','月','火','水','木','金','土'];
const iso = d => ymd(d);

function repLabel(r){
  if (!r) return '';
  if (r.freq === 'daily')   return '毎日';
  if (r.freq === 'weekly')  return '毎週 ' + WD[r.wd];
  if (r.freq === 'monthly') return '毎月 ' + r.dm + '日';
  if (r.freq === 'bizday')  return r.n === -1 ? '毎月 最終営業日' : '毎月 第' + r.n + '営業日';
  return `毎年 ${r.mo}/${r.dm}`;
}

const HOLIDAY_CHECKED_UNTIL = 2028;
const holCache = {};

function equinoxDay(y, spring){
  const base = spring ? 20.8431 : 23.2488;
  return Math.floor(base + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
}
function happyMonday(y, m, nth){
  const d = new Date(y, m - 1, 1, 12);
  d.setDate(1 + ((8 - d.getDay()) % 7) + 7 * (nth - 1));
  return d;
}
function holidays(y){
  if (holCache[y]) return holCache[y];
  const h = {};
  const put = (d, n) => { h[iso(d)] = n; };
  const D = (m, day) => new Date(y, m - 1, day, 12);
  put(D(1,1), '元日');
  put(happyMonday(y,1,2), '成人の日');
  put(D(2,11), '建国記念の日');
  put(D(2,23), '天皇誕生日');
  put(D(3, equinoxDay(y, true)), '春分の日');
  put(D(4,29), '昭和の日');
  put(D(5,3), '憲法記念日');
  put(D(5,4), 'みどりの日');
  put(D(5,5), 'こどもの日');
  put(happyMonday(y,7,3), '海の日');
  put(D(8,11), '山の日');
  put(happyMonday(y,9,3), '敬老の日');
  put(D(9, equinoxDay(y, false)), '秋分の日');
  put(happyMonday(y,10,2), 'スポーツの日');
  put(D(11,3), '文化の日');
  put(D(11,23), '勤労感謝の日');
  Object.keys(h).slice().sort().forEach(k => {
    const d = new Date(k + 'T12:00:00');
    const mid = new Date(d.getTime() + DAY), nx = new Date(d.getTime() + 2 * DAY);
    if (h[iso(nx)] && !h[iso(mid)] && mid.getDay() !== 0) h[iso(mid)] = '国民の休日';
  });
  Object.keys(h).slice().sort().forEach(k => {
    const d = new Date(k + 'T12:00:00');
    if (d.getDay() !== 0) return;
    let x = new Date(d.getTime() + DAY);
    while (h[iso(x)]) x = new Date(x.getTime() + DAY);
    h[iso(x)] = '振替休日';
  });
  holCache[y] = h;
  return h;
}
function isHoliday(d){ return !!holidays(d.getFullYear())[iso(d)]; }
function holidayName(d){ return holidays(d.getFullYear())[iso(d)] || null; }
function isBizDay(d){ const w = d.getDay(); return w !== 0 && w !== 6 && !isHoliday(d); }

function nthBizDay(y, m, n){
  const days = [];
  const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++){
    if (isBizDay(new Date(y, m, d, 12))) days.push(d);
  }
  const d = n === -1 ? days[days.length - 1] : days[Math.min(n, days.length) - 1];
  return new Date(y, m, d, 12);
}
function firstOccurrence(r){
  const d = atDayStart(today()); d.setHours(12,0,0,0);
  if (r.freq === 'bizday'){
    let t = nthBizDay(d.getFullYear(), d.getMonth(), r.n);
    if (t < d) t = nthBizDay(d.getFullYear(), d.getMonth() + 1, r.n);
    return iso(t);
  }
  if (r.freq === 'daily') return iso(d);
  if (r.freq === 'weekly'){ const diff = (r.wd - d.getDay() + 7) % 7; d.setDate(d.getDate()+diff); return iso(d); }
  if (r.freq === 'monthly'){
    const t = new Date(d.getFullYear(), d.getMonth(), r.dm);
    if (t < d) t.setMonth(t.getMonth()+1);
    return iso(t);
  }
  const t = new Date(d.getFullYear(), r.mo-1, r.dm);
  if (t < d) t.setFullYear(t.getFullYear()+1);
  return iso(t);
}
function nextOccurrence(dateStr, r){
  const d = new Date(dateStr + 'T12:00:00');
  if (r.freq === 'bizday') return iso(nthBizDay(d.getFullYear(), d.getMonth() + 1, r.n));
  if (r.freq === 'daily')   d.setDate(d.getDate()+1);
  if (r.freq === 'weekly')  d.setDate(d.getDate()+7);
  if (r.freq === 'monthly') d.setMonth(d.getMonth()+1);
  if (r.freq === 'yearly')  d.setFullYear(d.getFullYear()+1);
  return iso(d);
}
function sweep(){
  const t0 = today();
  const days = setting('archiveAfter');
  if (days > 0){
    const limit = new Date(atDayStart(t0).getTime() - (days - 1) * DAY);
    kids.forEach(k => {
      if (k.done && k.doneAt && !k.arch && !k.rep && atDayStart(k.doneAt) < limit) k.arch = true;
    });
  }
  parents.forEach(p => {
    if (p.done && p.doneAt && p.doneAt < t0){
      kids.forEach(k => { if (k.parent === p.id) k.arch = true; });
      p.arch = true;
    }
  });
  parents = parents.filter(p => !p.arch);
}

function cycleCheck(){
  sweep();
  const t0 = today();
  kids.filter(k => k.rep && k.done && k.nextAt && !k.arch).forEach(k => {
    const nextD = atDayStart(k.nextAt);
    const revive = new Date(nextD.getTime() - 3 * DAY);
    const after = k.doneAt ? new Date(atDayStart(k.doneAt).getTime() + DAY) : revive;
    const at = revive > after ? revive : after;
    if (atDayStart(t0) >= at){
      k.done = false; k.doneAt = null; k.now = false;
      k.due = k.nextAt;
    }
  });
}

function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function daysLeft(k){ return k.due ? (atDayStart(k.due) - now()) / DAY : null; }
function elapsed(k){
  const base = k.recv || k.since || null;
  return base ? (now() - atDayStart(base)) / DAY : 0;
}
function urgency(k){
  const R = daysLeft(k);
  let u;
  if (R !== null){
    u = R <= 0 ? 100 : 100 * (1 - Math.log(1 + R) / Math.log(1 + setting('horizon')));
  } else {
    let e;
    if (isWaiting(k)){
      const ws = waitSince(k);
      const from = k.recv ? atDayStart(k.recv) : null;
      const to = ws ? atDayStart(ws) : null;
      e = (from && to) ? Math.max(0, (to - from) / DAY) : 0;
    } else {
      e = Math.max(0, elapsed(k));
    }
    u = NODUE_BASE + (NODUE_CAP - NODUE_BASE) * Math.min(1, e / setting('nodueDays'));
  }
  return Math.max(MIN_U, Math.min(100, u));
}
function urgencyBack(k, d){ const s = offset; offset -= d; const v = urgency(k); offset = s; return v; }
function label(k){
  if (k.someday) return '時間があるとき';
  const R = daysLeft(k);
  if (R === null){
    const ws = waitSince(k);
    if (ws){
      const w = Math.floor((now() - atDayStart(ws)) / DAY);
      return w < 1 ? '待ち開始' : '待ち' + w + '日';
    }
    const e = Math.floor(Math.max(0, elapsed(k)));
    return e < 1 ? '本日受領' : '受領から' + e + '日';
  }
  if (R < 0) return Math.ceil(-R) + '日超過';
  if (R < 1) return '本日';
  return '残り' + Math.floor(R) + '日';
}
function stepWaiting(k){
  return (k.steps || []).some(st => st.waiting && !st.done);
}
function isWaiting(k){ return !!k.waiting || stepWaiting(k); }
function waitSince(k){
  const list = [];
  if (k.waiting && k.since) list.push(k.since);
  (k.steps || []).forEach(st => { if (st.waiting && !st.done && st.since) list.push(st.since); });
  if (!list.length) return null;
  return list.sort()[0];
}

function stepLabel(st){
  if (!st.since) return '';
  const e = Math.floor((now() - atDayStart(st.since)) / DAY);
  return e < 1 ? '本日' : e + '日経過';
}

let hoverId = null;

function trailFor(id){
  const k = kids.find(x => x.id === id);
  if (!k || k.done || k.arch) return '';
  const y = py(k.imp), x = px(urgency(k)), c = colorOf(k);
  let out = '';
  [5,4,3,2,1].forEach(b => {
    const xb = px(urgencyBack(k, b));
    if (Math.abs(xb - x) < 2) return;
    out += `<line x1="${xb.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c}" stroke-width="5" stroke-linecap="round" opacity="${(0.3 - b*0.045).toFixed(2)}"/>`;
  });
  if (out) out += `<circle cx="${px(urgencyBack(k,5)).toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="${c}" opacity="0.35"/>`;
  return out;
}

function drawTrails(){

function bindDots(){
  const tip = document.getElementById('tip'), box = document.querySelector('.mxwrap');
  document.querySelectorAll('.dot').forEach(el => {
    el.addEventListener('mousemove', e => {
      const r = box.getBoundingClientRect();
      let h = '';
      if (el.dataset.g){
        const ids = el.dataset.g.split(',');
        h = `<div class="b">${ids.length}件が重なっています</div>` + ids.map(id => {
          const k = kids.find(x => x.id === id);
          return `<div class="a">${esc(k.title)}</div><div class="c">${parOf(k).title} · ${label(k)}</div>`;
        }).join('');
      } else {
        const k = kids.find(x => x.id === el.dataset.id);
        h = `<div class="a">${esc(k.title)}</div><div class="b">${esc(parOf(k).title)}${isWaiting(k) ? (k.waiting ? ' · 相手待ち' : ' · 相手待ち（経過内）') : ''}</div>
             <div class="c">${label(k)} · 重要 ${k.imp} / 緊急 ${Math.round(urgency(k))}</div>`;
      }
      tip.innerHTML = h; tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 250) + 'px';
      tip.style.top  = Math.min(e.clientY - r.top + 14, r.height - tip.offsetHeight - 4) + 'px';
    });
    el.addEventListener('mouseenter', () => { hoverId = el.dataset.id || el.dataset.g; drawTrails(); });
    el.addEventListener('mouseleave', () => { tip.style.display = 'none'; hoverId = null; drawTrails(); });
    el.addEventListener('click', () => {
      const id = el.dataset.id || el.dataset.g.split(',')[0];
      sel = sel === id ? null : id; render();
      const n = document.querySelector('.ch.sel'); if (n) n.scrollIntoView({block:'nearest'});
    });
  });
}

function sortSteps(list){
  return list.slice().sort((a,b) => (a.done - b.done));
}
function sortKids(list){
  const arr = list.slice();
  const by = {
    urgency:(a,b)=>urgency(b)-urgency(a),
    due:(a,b)=>(a.due?atDayStart(a.due):Infinity)-(b.due?atDayStart(b.due):Infinity),
    imp:(a,b)=>b.imp-a.imp,
    manual:(a,b)=>(a.order||0)-(b.order||0)
  }[sortMode] || ((a,b)=>urgency(b)-urgency(a));
  return arr.sort((a,b) => (a.done - b.done) || ((a.someday?1:0) - (b.someday?1:0)) || by(a,b));
}
function reindex(){
  parents.slice().sort((a,b)=>(a.order||0)-(b.order||0)).forEach((p,i) => p.order = i);
  parents.forEach(p => kidsOf(p.id).sort((a,b)=>(a.order||0)-(b.order||0)).forEach((k,i) => k.order = i));
}
function parKey(p, fn, init, better){
  let v = init;
  kidsOf(p.id).filter(k => !k.done).forEach(k => { const x = fn(k); if (better(x, v)) v = x; });
  return v;
}
function sortedParents(){
  const arr = parents.slice();
  if (sortMode === 'urgency')
    return arr.sort((a,b) => parKey(b, urgency, -1, (x,v)=>x>v) - parKey(a, urgency, -1, (x,v)=>x>v));
  if (sortMode === 'due')
    return arr.sort((a,b) => parKey(a, k=>k.due?+atDayStart(k.due):Infinity, Infinity, (x,v)=>x<v)
                           - parKey(b, k=>k.due?+atDayStart(k.due):Infinity, Infinity, (x,v)=>x<v));
  if (sortMode === 'imp')
    return arr.sort((a,b) => parKey(b, k=>k.imp, -1, (x,v)=>x>v) - parKey(a, k=>k.imp, -1, (x,v)=>x>v));
  return arr.sort((a,b)=>(a.order||0)-(b.order||0));
}

function drawTasks(){
  const fa = document.getElementById('foldAll');
  if (fa) fa.textContent = parents.length && parents.every(p => collapsed.has(p.id)) ? 'すべて開く' : 'すべて閉じる';
  const el = document.getElementById('taskList');

  if (view === 'archive'){
    const d = kids.filter(k => k.arch).sort((a,b) => (b.doneAt||'').localeCompare(a.doneAt||''));
    el.innerHTML = d.length ? d.map(k => `<div class="arow">
      <span class="d">${k.doneAt ? k.doneAt.slice(5).replace('-','/') : '—'}</span>
      <span style="width:7px;height:7px;border-radius:2px;background:${colorOf(k)};flex:none"></span>
      <span class="t">${esc(k.title)}</span>
      <span class="apar">${esc((parOf(k)||{}).title || '')}</span>
      <button class="x arestore" data-unarch="${k.id}">戻す</button></div>`).join('')
      : '<div class="empty">しまわれたタスクはまだありません</div>';
    el.querySelectorAll('[data-unarch]').forEach(b => b.addEventListener('click', () => {
      const k = kids.find(x => x.id === b.dataset.unarch);
      k.arch = false; k.done = false; k.doneAt = null;
      const p = parents.find(x => x.id === k.parent);
      if (!p) k.parent = parents[0] ? parents[0].id : k.parent;
      render();
    }));
    return;
  }

  const man = sortMode === 'manual';
  let h = '';
  if (!parents.length) h += '<div class="hint">まず親タスクを追加。その下に子タスクを足していく</div>';

  sortedParents().forEach(p => {
    h += `<div class="par" data-pid="${p.id}" style="border-left-color:${p.color}">
      <div class="par-h${p.done ? ' pdone' : ''}"${man ? ` draggable="true" data-dragp="${p.id}"` : ''}>
        ${man
          ? '<span class="grip" title="ドラッグで並べ替え">⠿</span>'
          : `<span class="pcv" data-foldp="${p.id}" title="開閉">${collapsed.has(p.id) ? '▸' : '▾'}</span>`}
        <span class="par-t" data-p="${p.id}" title="クリックで子タスクを追加">${esc(p.title)}</span>
        <button class="editbtn" data-ep="${p.id}">編集</button>
        ${collapsed.has(p.id) ? `<span class="pcount">${kidsOf(p.id).filter(k=>!k.done).length}</span>` : ''}
        <span class="add" data-p="${p.id}">${openAdd === p.id ? '閉じる' : '＋ 子タスク'}</span>
        <button class="tr" data-del="${p.id}" title="親タスクごと削除">${TRASH}</button>
      </div>`;

    if (editP === p.id){
      h += `<div class="inline editbar">
        <input type="text" id="ep" value="${esc(p.title)}" autocomplete="off">
        <button class="btn sm pri" id="epsave">保存</button>
        <button class="btn sm" id="epcancel">やめる</button>
      </div>`;
    }

    if (!collapsed.has(p.id)) sortKids(kidsOf(p.id)).forEach(k => {
      h += `<div class="ch${k.done?' done':''}${sel===k.id?' sel':''}" data-kid="${k.id}"${man && !k.done ? ' draggable="true"' : ''}>
        ${man ? '<span class="grip sm" title="ドラッグで並べ替え">⠿</span>' : ''}
        <span class="box${k.done?' on':''}" data-tog="${k.id}"></span>
        ${isWaiting(k) && !k.done ? `<span class="wm${k.waiting ? '' : ' sub'}" style="border-color:${p.color}"></span>` : ''}
        <span class="ch-t" data-step="${k.id}" title="クリックで経過を追記">${esc(k.title)}</span>
        ${(k.steps||[]).filter(x=>!x.done).length ? `<span class="stepn">${(k.steps||[]).filter(x=>!x.done).length}</span>` : ''}
        <button class="editbtn" data-ek="${k.id}">編集</button>
        ${k.someday && !k.done ? '<span class="sdmark">いつか</span>' : ''}
        ${k.rep ? `<span class="rep">${repLabel(k.rep)}${k.done && k.nextAt ? ' · ' + k.nextAt.slice(5).replace('-','/') + ' 前に復活' : ''}</span>` : ''}
        ${k.done ? '' : `<button class="nowbtn${k.now?' on':''}" data-now="${k.id}">now</button>`}
        <button class="tr" data-delk="${k.id}" title="削除">${TRASH}</button>
        <span class="u">${k.done ? '' : label(k)}</span></div>`;
      if (!k.done && (k.steps||[]).length){
        const all = sortSteps(k.steps);
        const open = all.filter(x => !x.done), done = all.filter(x => x.done);
        const expand = stepsOpen.has(k.id);
        const LIMIT = 5;
        const hidden = Math.max(0, done.length - LIMIT);
        const shown = expand ? done : done.slice(0, LIMIT);
        const row = st => `<div class="st${st.done?' done':''}" data-stid="${st.id}">
          <span class="stbox${st.done?' on':''}" data-sttog="${st.id}"></span>
          ${st.waiting && !st.done ? `<span class="wm sm" style="border-color:${p.color}"></span>` : ''}
          ${editStep === st.id
            ? `<input type="text" class="stedit" id="se" value="${esc(st.text)}">`
            : `<span class="stt" data-stedit="${st.id}" title="クリックで編集">${esc(st.text)}</span>`}
          ${st.done ? '' : `<button class="waitbtn${st.waiting?' on':''}" data-stwait="${st.id}">待ち</button>`}
          ${st.waiting && !st.done ? `<span class="u">${stepLabel(st)}</span>` : ''}
          <button class="tr" data-stdel="${st.id}">${TRASH}</button></div>`;
        h += open.map(row).join('');
        h += shown.map(row).join('');
        if (hidden > 0 || (expand && done.length > LIMIT)){
          h += `<div class="stmore" data-stmore="${k.id}">${
            expand ? '<span class="dots">•••</span>古い経過を畳む'
                   : `<span class="dots">•••</span>ほかに ${hidden} 件`}</div>`;
        }
      }
      if (openStep === k.id){
        h += `<div class="inline stadd">
          <input type="text" id="si" placeholder="経過を追記" autocomplete="off">
          <label class="cb"><input type="checkbox" id="sw"> 相手待ち</label>
          <button class="btn sm pri" id="sadd">追記</button>
        </div>`;
      }
      if (editK === k.id){
        h += `<div class="inline editbar">
          <input type="text" id="ek" value="${esc(k.title)}" autocomplete="off">
          <span class="lab">連絡日</span><input type="date" id="ekr" value="${k.recv || ''}">
          <span class="lab">締切</span><input type="date" id="ekd" value="${k.due || ''}">
          <span class="sl"><span class="lab">重要</span><input type="range" id="ekm" min="1" max="10" value="${k.imp}"><b id="ekmv">${k.imp}</b></span>
          <label class="cb"><input type="checkbox" id="ekw"${k.waiting?' checked':''}> 相手待ち</label>
          <label class="cb"><input type="checkbox" id="eksd"${k.someday?' checked':''}> 時間があるとき</label>
          <span class="lab">ルーチン</span>
          <select id="rf">
            <option value="">なし</option>
            <option value="daily"${k.rep && k.rep.freq==='daily'?' selected':''}>毎日</option>
            <option value="weekly"${k.rep && k.rep.freq==='weekly'?' selected':''}>毎週</option>
            <option value="monthly"${k.rep && k.rep.freq==='monthly'?' selected':''}>毎月（日付）</option>
            <option value="bizday"${k.rep && k.rep.freq==='bizday'?' selected':''}>毎月（営業日）</option>
            <option value="yearly"${k.rep && k.rep.freq==='yearly'?' selected':''}>毎年</option>
          </select>
          <span id="ropt"></span>
          <span class="lab">親</span>
          <select id="ekp">${sortedParents().map(x =>
            `<option value="${x.id}"${x.id===k.parent?' selected':''}>${esc(x.title)}</option>`).join('')}</select>
          <button class="btn sm pri" id="eksave">保存</button>
          <button class="btn sm" id="ekcancel">やめる</button>
        </div>`;
      }
    });

    if (openAdd === p.id && !collapsed.has(p.id)){
      h += `<div class="inline">
        <input type="text" id="ni" placeholder="子タスク名" autocomplete="off">
        <span class="lab">連絡日</span><input type="date" id="nr" value="${today()}">
        <span class="lab">締切</span><input type="date" id="nd">
        <span class="sl"><span class="lab">重要</span><input type="range" id="nm" min="1" max="10" value="5"><b id="nmv">5</b></span>
        <label class="cb"><input type="checkbox" id="nw"> 相手待ち</label>
        <label class="cb"><input type="checkbox" id="nsd"> 時間があるとき</label>
        <span class="lab">ルーチン</span>
        <select id="nrf">
          <option value="">なし</option>
          <option value="daily">毎日</option>
          <option value="weekly">毎週</option>
          <option value="monthly">毎月（日付）</option>
          <option value="bizday">毎月（営業日）</option>
          <option value="yearly">毎年</option>
        </select>
        <span id="nropt"></span>
        <button class="btn sm pri" id="nadd">追加</button>
      </div>`;
    }
    h += '</div>';
  });

  h += addingParent
    ? `<div class="inline" style="padding-left:0">
        <input type="text" id="pi" placeholder="親タスク名" autocomplete="off">
        <button class="btn sm pri" id="padd">追加</button>
        <button class="btn sm" id="pcancel">やめる</button></div>`
    : `<button class="btn sm" id="pnew" style="margin-top:2px">＋ 親タスク</button>`;

  el.innerHTML = h;

  el.querySelectorAll('[data-p]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.p;
    openAdd = openAdd === id ? null : id; editP = null; editK = null; openStep = null; drawTasks();
    const i = document.getElementById('ni'); if (i) i.focus();
  }));
  el.querySelectorAll('[data-foldp]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.foldp;
    if (e.altKey){
      const anyOpen = parents.some(p => !collapsed.has(p.id));
      collapsed = anyOpen ? new Set(parents.map(p => p.id)) : new Set();
    } else {
      collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    }
    drawTasks();
  }));
  el.querySelectorAll('[data-ep]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.ep;
    editP = editP === id ? null : id; editK = null; openAdd = null; drawTasks();
    const i = document.getElementById('ep'); if (i){ i.focus(); i.select(); }
  }));
  el.querySelectorAll('[data-ek]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.ek;
    editK = editK === id ? null : id; editP = null; openStep = null; drawTasks();
    const i = document.getElementById('ek'); if (i){ i.focus(); i.select(); }
  }));
  el.querySelectorAll('[data-step]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.step;
    openStep = openStep === id ? null : id; editK = null; editP = null; drawTasks();
    const i = document.getElementById('si'); if (i) i.focus();
  }));
  el.querySelectorAll('[data-sttog]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.sttog;
    kids.forEach(k => (k.steps||[]).forEach(st => { if (st.id === id) st.done = !st.done; }));
    render();
  }));
  el.querySelectorAll('[data-stwait]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.stwait;
    kids.forEach(k => (k.steps||[]).forEach(st => {
      if (st.id !== id) return;
      st.waiting = !st.waiting;
      st.since = st.waiting ? (st.since || today()) : null;
    }));
    render();
  }));
  el.querySelectorAll('[data-stmore]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.stmore;
    stepsOpen.has(id) ? stepsOpen.delete(id) : stepsOpen.add(id);
    drawTasks();
  }));
  el.querySelectorAll('[data-stedit]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    editStep = editStep === n.dataset.stedit ? null : n.dataset.stedit;
    drawTasks();
    const i = document.getElementById('se'); if (i){ i.focus(); i.select(); }
  }));
  const se = document.getElementById('se');
  if (se){
    const save = () => {
      const t = se.value.trim();
      if (!t) return se.focus();
      kids.forEach(k => (k.steps||[]).forEach(st => { if (st.id === editStep) st.text = t; }));
      editStep = null; render();
    };
    se.addEventListener('keydown', e => {
      if (e.key === 'Enter') save();
      if (e.key === 'Escape'){ e.stopPropagation(); editStep = null; drawTasks(); }
    });
    se.addEventListener('blur', save);
  }
  el.querySelectorAll('[data-stdel]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.stdel;
    kids.forEach(k => { if (k.steps) k.steps = k.steps.filter(st => st.id !== id); });
    render();
  }));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.del, n = kidsOf(id).length;
    if (n && !confirm(`子タスク${n}件ごと削除する`)) return;
    parents = parents.filter(x => x.id !== id);
    kids = kids.filter(k => k.parent !== id);
    if (openAdd === id) openAdd = null;
    reindex(); render();
  }));
  el.querySelectorAll('[data-delk]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    kids = kids.filter(k => k.id !== b.dataset.delk);
    reindex(); render();
  }));
  el.querySelectorAll('[data-tog]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const k = kids.find(x => x.id === b.dataset.tog);
    k.done = !k.done; k.doneAt = k.done ? today() : null; if (k.done) k.now = false;
    if (k.rep && k.done){
      let nx = k.nextAt || k.due || today();
      let guard = 0;
      while (nx <= today() && guard++ < 400) nx = nextOccurrence(nx, k.rep);
      k.nextAt = nx;
    }
    render();
  }));
  el.querySelectorAll('[data-now]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const k = kids.find(x => x.id === b.dataset.now); k.now = !k.now; render();
  }));

  bindDrag(el);

  const sadd = document.getElementById('sadd');
  if (sadd){
    const go = () => {
      const inp = document.getElementById('si');
      const t = inp.value.trim();
      if (!t) return inp.focus();
      const k = kids.find(x => x.id === openStep);
      k.steps = k.steps || [];
      const w = document.getElementById('sw').checked;
      k.steps.push({id:'s'+(uid++), text:t, done:false, waiting:w, since:w ? today() : null});
      render();
      const i = document.getElementById('si'); if (i) i.focus();
    };
    sadd.addEventListener('click', go);
    document.getElementById('si').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); openStep = null; drawTasks(); }
    });
  }

  const ekm = document.getElementById('ekm');
  if (ekm) ekm.addEventListener('input', e => document.getElementById('ekmv').textContent = e.target.value);

  const rf = document.getElementById('rf');
  if (rf){
    const k = kids.find(x => x.id === editK);
    const opt = document.getElementById('ropt');
    const drawOpt = f => {
      const r = (k && k.rep) || {};
      if (f === 'weekly') opt.innerHTML = `<select id="rv">${WD.map((w,i) =>
        `<option value="${i}"${(r.wd !== undefined ? r.wd : now().getDay())===i?' selected':''}>${w}曜</option>`).join('')}</select>`;
      else if (f === 'monthly') opt.innerHTML = `<select id="rv">${Array.from({length:31},(_,i)=>i+1).map(d =>
        `<option value="${d}"${(r.dm !== undefined ? r.dm : now().getDate())===d?' selected':''}>${d}日</option>`).join('')}</select>`;
      else if (f === 'bizday') opt.innerHTML = `<select id="rv">${
        Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}"${(r.n||1)===n?' selected':''}>第${n}営業日</option>`).join('')
        }<option value="-1"${r.n===-1?' selected':''}>最終営業日</option></select>`;
      else if (f === 'yearly') opt.innerHTML = `<input type="date" id="rv" value="${r.mo ?
        `${now().getFullYear()}-${String(r.mo).padStart(2,'0')}-${String(r.dm).padStart(2,'0')}` : today()}">`;
      else opt.innerHTML = '';
    };
    drawOpt(rf.value);
    rf.addEventListener('change', () => drawOpt(rf.value));
  }

  const eksave = document.getElementById('eksave');
  if (eksave){
    const go = () => {
      const k = kids.find(x => x.id === editK);
      const t = document.getElementById('ek').value.trim();
      if (!t) return document.getElementById('ek').focus();
      const w = document.getElementById('ekw').checked;
      k.title = t;
      k.due = document.getElementById('ekd').value || null;
      k.recv = document.getElementById('ekr').value || k.recv || today();
      k.imp = +document.getElementById('ekm').value;
      if (w && !k.waiting) k.since = today();
      if (!w) k.since = null;
      k.waiting = w;
      k.someday = document.getElementById('eksd').checked;
      const np = document.getElementById('ekp').value;
      if (np !== k.parent){ k.parent = np; k.order = 9999; }
      const f = document.getElementById('rf').value;
      if (!f){ k.rep = null; k.nextAt = null; }
      else {
        const v = document.getElementById('rv');
        const r = {freq:f};
        if (f === 'weekly')  r.wd = +v.value;
        if (f === 'monthly') r.dm = +v.value;
        if (f === 'bizday')  r.n  = +v.value;
        if (f === 'yearly'){ const dt = atDayStart(v.value); r.mo = dt.getMonth()+1; r.dm = dt.getDate(); }
        k.rep = r; k.nextAt = firstOccurrence(r);
        if (!k.due) k.due = k.nextAt;
      }
      editK = null; reindex(); render();
    };
    eksave.addEventListener('click', go);
    document.getElementById('ek').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); editK = null; drawTasks(); }
    });
    document.getElementById('ekcancel').addEventListener('click', () => { editK = null; drawTasks(); });
  }

  const epsave = document.getElementById('epsave');
  if (epsave){
    const go = () => {
      const p = parents.find(x => x.id === editP);
      const t = document.getElementById('ep').value.trim();
      if (!t) return document.getElementById('ep').focus();
      p.title = t; editP = null; render();
    };
    epsave.addEventListener('click', go);
    document.getElementById('ep').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); editP = null; drawTasks(); }
    });
    document.getElementById('epcancel').addEventListener('click', () => { editP = null; drawTasks(); });
  }

  const nm = document.getElementById('nm');
  if (nm) nm.addEventListener('input', e => document.getElementById('nmv').textContent = e.target.value);

  const nrf = document.getElementById('nrf');
  if (nrf){
    const opt = document.getElementById('nropt');
    const drawOpt = f => {
      if (f === 'weekly') opt.innerHTML = `<select id="nrv">${WD.map((w,i) =>
        `<option value="${i}"${now().getDay()===i?' selected':''}>${w}曜</option>`).join('')}</select>`;
      else if (f === 'monthly') opt.innerHTML = `<select id="nrv">${Array.from({length:31},(_,i)=>i+1).map(d =>
        `<option value="${d}"${now().getDate()===d?' selected':''}>${d}日</option>`).join('')}</select>`;
      else if (f === 'bizday') opt.innerHTML = `<select id="nrv">${
        Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}">第${n}営業日</option>`).join('')
        }<option value="-1">最終営業日</option></select>`;
      else if (f === 'yearly') opt.innerHTML = `<input type="date" id="nrv" value="${today()}">`;
      else opt.innerHTML = '';
    };
    nrf.addEventListener('change', () => drawOpt(nrf.value));
  }

  const nadd = document.getElementById('nadd');
  if (nadd){
    const go = () => {
      const t = document.getElementById('ni').value.trim();
      if (!t) return document.getElementById('ni').focus();
      const w = document.getElementById('nw').checked;
      const dEl = document.getElementById('nd');
      let rep = null, nextAt = null, due = dEl.value || null;
      const f = document.getElementById('nrf').value;
      if (f){
        const v = document.getElementById('nrv');
        rep = {freq:f};
        if (f === 'weekly')  rep.wd = +v.value;
        if (f === 'monthly') rep.dm = +v.value;
        if (f === 'bizday')  rep.n  = +v.value;
        if (f === 'yearly'){ const dt = atDayStart(v.value); rep.mo = dt.getMonth()+1; rep.dm = dt.getDate(); }
        nextAt = firstOccurrence(rep);
        if (!due) due = nextAt;
      }
      kids.push({id:'k'+(uid++), parent:openAdd, title:t, imp:+document.getElementById('nm').value,
        due, recv: document.getElementById('nr').value || today(),
        someday: document.getElementById('nsd').checked,
        waiting:w, since:w ? today() : null,
        done:false, doneAt:null, now:false, arch:false, rep, nextAt,
        order: kidsOf(openAdd).length});
      render();
      const i = document.getElementById('ni'); if (i) i.focus();
    };
    nadd.addEventListener('click', go);
    document.getElementById('ni').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); openAdd = null; drawTasks(); }
    });
  }
  const pnew = document.getElementById('pnew');
  if (pnew) pnew.addEventListener('click', () => { addingParent = true; drawTasks(); document.getElementById('pi').focus(); });
  const padd = document.getElementById('padd');
  if (padd){
    const go = () => {
      const t = document.getElementById('pi').value.trim();
      if (!t) return;
      const id = 'p'+(uid++);
      parents.push({id, title:t, color:COLORS[parents.length % COLORS.length],
        done:false, doneAt:null, order:parents.length});
      addingParent = false; openAdd = id; render();
      const i = document.getElementById('ni'); if (i) i.focus();
    };
    padd.addEventListener('click', go);
    document.getElementById('pi').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); addingParent = false; drawTasks(); }
    });
    document.getElementById('pcancel').addEventListener('click', () => { addingParent = false; drawTasks(); });
  }
}

let drag = null;

function bindDrag(el){
  el.querySelectorAll('[data-dragp]').forEach(n => {
    n.addEventListener('dragstart', e => {
      drag = {type:'p', id:n.dataset.dragp};
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', n.dataset.dragp);
    });
  });
  el.querySelectorAll('.ch[draggable]').forEach(n => {
    n.addEventListener('dragstart', e => {
      drag = {type:'k', id:n.dataset.kid};
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', n.dataset.kid);
      e.stopPropagation();
    });
  });

  el.addEventListener('dragover', e => {
    if (!drag) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    clearDropMark(el);
    const t = dropTarget(e);
    if (t) t.el.classList.add('drop');
  });
  el.addEventListener('drop', e => {
    if (!drag) return;
    e.preventDefault();
    const t = dropTarget(e);
    if (t){
      if (drag.type === 'p' && t.pid){
        if (sortMode !== 'manual'){
          const cur = sortedParents();
          sortMode = 'manual';
          cur.forEach((p,i) => p.order = i);
          const sel = document.getElementById('sortSel');
          if (sel) sel.value = 'manual';
        }
        movePar(drag.id, t.pid);
      }
      if (drag.type === 'k'){
        if (t.kid){
          const target = kids.find(x => x.id === t.kid);
          if (target && target.id !== drag.id) moveKid(drag.id, target.parent, target.id);
        } else if (t.pid){
          moveKid(drag.id, t.pid, null);
        }
      }
    }
    drag = null; clearDropMark(el); reindex(); render();
  });
  el.addEventListener('dragend', () => { drag = null; clearDropMark(el); });
}

function dropTarget(e){
  const path = e.composedPath ? e.composedPath() : [];
  for (const n of path){
    if (!n.dataset) continue;
    if (drag.type === 'k' && n.dataset.kid) return {el:n, kid:n.dataset.kid};
    if (n.dataset.pid) return {el:n, pid:n.dataset.pid};
  }
  return null;
}

function clearDropMark(el){ el.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); }

function movePar(from, to){
  if (from === to) return;
  const arr = sortedParents();
  const f = arr.findIndex(p => p.id === from), t = arr.findIndex(p => p.id === to);
  arr.splice(t, 0, arr.splice(f, 1)[0]);
  arr.forEach((p, i) => p.order = i);
}
function moveKid(from, toParent, beforeId){
  const k = kids.find(x => x.id === from);
  if (!k) return;
  k.parent = toParent;
  if (sortMode !== 'manual') return;
  const arr = kidsOf(toParent).sort((a,b)=>(a.order||0)-(b.order||0));
  const cur = arr.findIndex(x => x.id === from);
  if (cur >= 0) arr.splice(cur, 1);
  const at = beforeId ? arr.findIndex(x => x.id === beforeId) : arr.length;
  arr.splice(at < 0 ? arr.length : at, 0, k);
  arr.forEach((x, i) => x.order = i);
}

function drawWait(){
  const l = kids.filter(k => k.waiting && !k.done && !k.arch)
    .map(k => ({c:colorOf(k), t:k.title, sub:'', e:label(k), u:urgency(k)}));
  kids.filter(k => !k.done && !k.arch).forEach(k =>
    (k.steps||[]).filter(st => st.waiting && !st.done).forEach(st =>
      l.push({c:colorOf(k), t:st.text, sub:k.title, e:stepLabel(st), u:urgency(k)})));
  l.sort((a,b) => b.u - a.u);
  document.getElementById('waitCount').textContent = l.length || '';
  document.getElementById('waitList').innerHTML = l.length ? l.map(x =>
    `<div class="wt"><span class="d" style="border-color:${x.c}"></span>
      <span class="t">${x.sub ? `<span class="sub">${esc(x.sub)} › </span>` : ''}${esc(x.t)}</span>
      <span class="e">${x.e}</span></div>`).join('')
    : '<div class="empty">「相手待ち」を付けたものがここに並ぶ</div>';
}

let dirDrag = null;
function dirDropTarget(e){
  const path = e.composedPath ? e.composedPath() : [];
  for (const n of path) if (n.dataset && n.dataset.did) return n;
  return null;
}
function dirDropMode(el, e){
  const d = dirs.find(x => x.id === el.dataset.did);
  const r = el.getBoundingClientRect();
  const rel = (e.clientY - r.top) / r.height;
  if (d && d.type === 'folder' && rel > 0.28 && rel < 0.72) return 'into';
  return rel <= 0.5 ? 'before' : 'after';
}
function clearDirMark(tree){
  tree.querySelectorAll('.drop-into,.drop-before,.drop-after')
    .forEach(x => x.classList.remove('drop-into','drop-before','drop-after'));
}
function dirChildren(pid){
  const arr = dirs.filter(d => d.p === pid && !d.deletedAt);
  const fFirst = (a,b) => folderFirst ? (a.type === b.type ? 0 : a.type === 'folder' ? -1 : 1) : 0;
  if (dirSort === 'manual') return arr.sort((a,b) => fFirst(a,b) || (a.order||0) - (b.order||0));
  return arr.sort((a,b) => fFirst(a,b) || a.name.localeCompare(b.name, 'ja'));
}
function trashed(){ return dirs.filter(d => d.deletedAt && !d.delVia); }
function purgeTrash(){
  const limit = new Date(now().getTime() - 30 * DAY);
  const gone = dirs.filter(d => d.deletedAt && atDayStart(d.deletedAt) < limit).map(d => d.id);
  if (gone.length) dirs = dirs.filter(d => !gone.includes(d.id) && !gone.includes(d.delVia));
}
function trashDays(d){
  return Math.max(0, 30 - Math.floor((now() - atDayStart(d.deletedAt)) / DAY));
}
function allFolders(){ return dirs.filter(d => d.type === 'folder' && !d.deletedAt); }
function dirReindex(){
  const groups = new Set(dirs.map(d => d.p));
  groups.forEach(g => dirChildren(g).forEach((d,i) => d.order = i));
}
function descendants(id){
  const out = [];
  const walk = pid => dirs.filter(d => d.p === pid && !d.deletedAt).forEach(c => { out.push(c); walk(c.id); });
  walk(id);
  return out;
}

const TRASH_VIEW = '__trash';

function dirRow(d){
  const isF = d.type === 'folder';
  const n = isF ? dirChildren(d.id).length : 0;
  return `<div class="dn ${isF ? 'folder' : 'entry'}${selDir === d.id ? ' sel' : ''}"
      data-did="${d.id}" data-type="${d.type}" draggable="true">
    ${dirColor(d) ? `<span class="dcol" style="background:${dirColor(d)}"></span>` : '<span class="dcol none"></span>'}
    <span class="${isF ? 'fn' : 'en'}${!isF && isUrl(d.path) ? ' link' : ''}">${d.name}${!isF && isUrl(d.path) ? '<span class="lmk">↗</span>' : ''}</span>
    ${isF ? `<span class="cnum">${n || ''}</span>` : ''}
    ${!isF && d.path ? `<span class="ppeek">${esc(d.path)}</span>` : ''}
    ${isF ? `<button class="x ax" data-af="${d.id}" title="フォルダを追加"><span class="axi">▤</span><span class="axl">＋フォルダ</span></button>
    <button class="x ax" data-ae="${d.id}" title="パスを追加"><span class="axi">＋</span><span class="axl">＋パス</span></button>` : ''}
    <button class="tr" data-del="${d.id}" title="ゴミ箱へ">${TRASH}</button>
    ${isF ? '<span class="cv">›</span>' : ''}
  </div>`;
}

function dirForm(depth){
  const isF = adding.type === 'folder';
  return `<div class="dform" style="margin-left:${6 + (depth || 0) * 15}px">
    <input type="text" id="dnm" placeholder="${isF ? 'フォルダ名' : '表示名'}" autocomplete="off">
    ${isF ? '' : `<input type="text" id="dpt" placeholder="パス" autocomplete="off">
    <input type="text" id="dnt" placeholder="メモ" autocomplete="off">`}
    <div style="display:flex;gap:6px">
      <button class="btn sm pri" id="dadd">追加</button>
      <button class="btn sm" id="dcancel">やめる</button></div></div>`;
}

function guides(pre, last){
  let h = pre.map(v => `<span class="gl${v ? ' v' : ''}"></span>`).join('');
  h += `<span class="el${last ? ' last' : ''}"></span>`;
  return h;
}

function treeRow(d, pre, last){
  const isF = d.type === 'folder';
  const g = guides(pre, last);
  if (!isF){
    return `<div class="dn entry${selDir === d.id ? ' sel' : ''}" data-did="${d.id}" data-type="entry" draggable="true">
      ${g}${dirColor(d) ? `<span class="dcol" style="background:${dirColor(d)}"></span>` : '<span class="dcol none"></span>'}<span class="ficon file"></span>
      <span class="en${isUrl(d.path) ? ' link' : ''}">${esc(d.name)}${isUrl(d.path) ? '<span class="lmk">↗</span>' : ''}</span>
      ${d.path ? `<span class="ppeek">${esc(d.path)}</span>` : ''}
      <button class="tr" data-del="${d.id}" title="ゴミ箱へ">${TRASH}</button></div>`;
  }
  const open = expanded.has(d.id);
  const list = dirChildren(d.id);
  let h = `<div class="dn folder" data-did="${d.id}" data-type="folder" data-fold="${d.id}" draggable="true">
    ${g}<span class="cvt">${open ? '▾' : '▸'}</span>
    ${dirColor(d) ? `<span class="dcol" style="background:${dirColor(d)}"></span>` : '<span class="dcol none"></span>'}<span class="ficon"></span>
    <span class="fn">${esc(d.name)}</span>
    <span class="cnum">${list.length || ''}</span>
    <button class="x ax" data-af="${d.id}" title="フォルダを追加"><span class="axi">▤</span><span class="axl">＋フォルダ</span></button>
    <button class="x ax" data-ae="${d.id}" title="パスを追加"><span class="axi">＋</span><span class="axl">＋パス</span></button>
    <button class="tr" data-del="${d.id}" title="ゴミ箱へ">${TRASH}</button></div>`;
  if (open){
    const sub = pre.concat([!last]);
    h += list.map((c, i) => treeRow(c, sub, i === list.length - 1 && !(adding && adding.parent === d.id))).join('');
    if (adding && adding.parent === d.id) h += dirForm(sub.length);
  }
  return h;
}

function crumbs(){
  const parts = [];
  let cur = cwd;
  while (cur && cur !== INBOX && cur !== TRASH_VIEW){
    const d = dirs.find(x => x.id === cur);
    if (!d) break;
    parts.unshift({id:d.id, name:d.name});
    cur = d.p;
  }
  let h = `<span class="cr${cwd===null?' now':''}" data-cd="">ルート</span>`;
  if (cwd === INBOX) h += `<span class="crsep">/</span><span class="cr now" data-cd="${INBOX}">未整理</span>`;
  else if (cwd === TRASH_VIEW) h += `<span class="crsep">/</span><span class="cr now" data-cd="${TRASH_VIEW}">ゴミ箱</span>`;
  else parts.forEach((x,i) => {
    h += `<span class="crsep">/</span><span class="cr${i===parts.length-1?' now':''}" data-cd="${x.id}">${esc(x.name)}</span>`;
  });
  return h;
}

function drawDirs(){
  scheduleSave();
  purgeTrash();
  const tree = document.getElementById('dtree');
  const inTrash = cwd === TRASH_VIEW;

  let h = `<div class="ph dph" style="border:none;padding:0 0 7px">
    <span class="pt">directories</span>
    <div class="vtog">
      <button class="vt${dirView==='explorer'?' on':''}" data-view="explorer">階層移動</button>
      <button class="vt${dirView==='tree'?' on':''}" data-view="tree">ツリー</button>
    </div>
    ${dirView === 'tree' ? `<button class="x foldall" id="dirFoldAll" title="Altクリックでも一括">${
      allFolders().length && allFolders().every(f => expanded.has(f.id)) ? 'すべて閉じる' : 'すべて開く'
    }</button>` : ''}
    <label class="cb ff"><input type="checkbox" id="ffChk"${folderFirst?' checked':''}> フォルダを上に</label>
    <select id="dirSort" class="sortsel">
      <option value="name"${dirSort==='name'?' selected':''}>名前順</option>
      <option value="manual"${dirSort==='manual'?' selected':''}>手動</option>
    </select></div>`;

  if (dirView === 'tree' && !inTrash){
    const inbox = dirs.filter(d => d.p === INBOX && !d.deletedAt);
    h += `<div class="inbox-h">INBOX <span class="n">${inbox.length}</span>
      <button class="x" id="quickNew">＋ とりあえず登録</button></div>`;
    if (adding && adding.parent === INBOX) h += dirForm(0);
    h += inbox.length ? inbox.map((d,i) => treeRow(d, [], i === inbox.length - 1)).join('')
       : (adding && adding.parent === INBOX ? '' : '<div class="hint">パスと名前だけ入れて後で整理</div>');
    h += '<div class="inbox-sep"></div>';
    const roots = dirChildren(null);
    h += roots.map((d,i) => treeRow(d, [], i === roots.length - 1)).join('');
    if (adding && adding.parent === null) h += dirForm(0);
    if (!roots.length && !(adding && adding.parent === null)) h += '<div class="hint">フォルダかパスを追加</div>';
    h += `<div class="dbar">
      <button class="btn sm" data-new="folder">＋ フォルダ</button>
      <button class="btn sm" data-new="entry">＋ パス</button>
      <button class="btn sm tbtn" data-cd="${TRASH_VIEW}">ゴミ箱 ${trashed().length || ''}</button>
    </div>`;
    tree.innerHTML = h;
    bindDirs(tree);
    drawDirDetail();
    return;
  }

  h += `<div class="crumbs">${crumbs()}</div>`;

  if (inTrash){
    const tl = trashed();
    h += tl.length ? tl.map(d => `<div class="dn trashrow">
      <span class="${d.type === 'folder' ? 'fn' : 'en'}">${esc(d.name)}</span>
      <span class="tleft">あと${trashDays(d)}日</span>
      <button class="x" data-restore="${d.id}">戻す</button>
      <button class="x" data-purge="${d.id}">完全削除</button></div>`).join('')
      : '<div class="hint">ゴミ箱は空</div>';
    h += `<div class="dbar"><button class="btn sm" data-cd="">ルートへ戻る</button></div>`;
    tree.innerHTML = h;
    bindDirs(tree);
    drawDirDetail();
    return;
  }

  if (cwd !== null){
    const parent = cwd === INBOX ? '' : (dirs.find(x => x.id === cwd) || {}).p || '';
    h += `<div class="dn up" data-cd="${parent}"><span class="cv">‹</span><span class="fn">上へ</span></div>`;
  }

  if (cwd === null){
    const inbox = dirs.filter(d => d.p === INBOX && !d.deletedAt);
    h += `<div class="dn folder special" data-cd="${INBOX}">
      <span class="fn">未整理</span><span class="cnum">${inbox.length || ''}</span><span class="cv">›</span></div>`;
  }

  const list = dirChildren(cwd);
  h += list.map(dirRow).join('');
  if (adding && adding.parent === cwd) h += dirForm();
  if (!list.length && !(adding && adding.parent === cwd))
    h += `<div class="hint">${cwd === INBOX ? 'とりあえず登録したものがここに入る' : 'フォルダかパスを追加'}</div>`;

  h += `<div class="dbar">
    <button class="btn sm" data-new="folder">＋ フォルダ</button>
    <button class="btn sm" data-new="entry">＋ パス</button>
    ${cwd === null ? '<button class="btn sm" id="quickNew">＋ とりあえず登録</button>' : ''}
    <button class="btn sm tbtn" data-cd="${TRASH_VIEW}">ゴミ箱 ${trashed().length || ''}</button>
  </div>`;

  tree.innerHTML = h;
  bindDirs(tree);
  drawDirDetail();
}

function bindDirs(tree){
  tree.querySelectorAll('[data-cd]').forEach(n => n.addEventListener('click', e => {
    if (e.target.closest('button.tr')) return;
    const v = n.dataset.cd;
    cwd = v === '' ? null : v;
    selDir = null; adding = null; drawDirs();
  }));
  tree.querySelectorAll('.dn.entry').forEach(n => n.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    selDir = n.dataset.did; drawDirs();
  }));
  tree.querySelectorAll('.dn.folder[data-did]').forEach(n => n.addEventListener('dblclick', () => {
    cwd = n.dataset.did; selDir = null; drawDirs();
  }));
  tree.querySelectorAll('.dn.folder[data-did] .cv').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    cwd = n.closest('.dn').dataset.did; selDir = null; drawDirs();
  }));

  tree.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    dirView = b.dataset.view;
    if (dirView === 'explorer') cwd = null;
    adding = null; drawDirs();
  }));
  tree.querySelectorAll('[data-fold]').forEach(n => n.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const id = n.dataset.fold, open = expanded.has(id);
    if (e.altKey){
      const ids = [id, ...descendants(id).filter(x => x.type === 'folder').map(x => x.id)];
      ids.forEach(x => open ? expanded.delete(x) : expanded.add(x));
    } else {
      open ? expanded.delete(id) : expanded.add(id);
    }
    drawDirs();
  }));

  const dfa = document.getElementById('dirFoldAll');
  if (dfa) dfa.addEventListener('click', () => {
    const all = allFolders();
    const allOpen = all.length && all.every(f => expanded.has(f.id));
    expanded = allOpen ? new Set() : new Set(all.map(f => f.id));
    drawDirs();
  });
  const ff = document.getElementById('ffChk');
  if (ff) ff.addEventListener('change', e => { folderFirst = e.target.checked; drawDirs(); });
  const ds = document.getElementById('dirSort');
  if (ds) ds.addEventListener('change', e => {
    if (e.target.value === 'manual') dirReindex();
    dirSort = e.target.value; drawDirs();
  });

  tree.querySelectorAll('[data-af],[data-ae]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.af || b.dataset.ae;
    if (dirView === 'tree') expanded.add(id); else cwd = id;
    adding = {parent:id, type: b.dataset.af ? 'folder' : 'entry'};
    drawDirs();
    const i = document.getElementById('dnm'); if (i) i.focus();
  }));
  tree.querySelectorAll('[data-new]').forEach(b => b.addEventListener('click', () => {
    adding = {parent: dirView === 'tree' ? null : cwd, type:b.dataset.new};
    drawDirs(); const i = document.getElementById('dnm'); if (i) i.focus();
  }));
  const qn = document.getElementById('quickNew');
  if (qn) qn.addEventListener('click', () => {
    cwd = INBOX; adding = {parent:INBOX, type:'entry'};
    drawDirs(); const i = document.getElementById('dnm'); if (i) i.focus();
  });

  tree.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.del, d = dirs.find(x => x.id === id);
    const sub = descendants(id);
    const msg = sub.length ? `「${d.name}」を中身${sub.length}件ごとゴミ箱に入れる` : `「${d.name}」をゴミ箱に入れる`;
    if (!confirm(msg + '\n30日後に自動で消える')) return;
    const stamp = today();
    d.deletedAt = stamp; d.delVia = null;
    sub.forEach(x => { x.deletedAt = stamp; x.delVia = id; });
    if (selDir === id || sub.some(x => x.id === selDir)) selDir = null;
    drawDirs();
  }));
  tree.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.restore;
    dirs.forEach(x => { if (x.id === id || x.delVia === id){ x.deletedAt = null; x.delVia = null; } });
    drawDirs();
  }));
  tree.querySelectorAll('[data-purge]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('完全に削除する。元に戻せない')) return;
    const id = b.dataset.purge;
    dirs = dirs.filter(x => x.id !== id && x.delVia !== id);
    drawDirs();
  }));

  const da = document.getElementById('dadd');
  if (da){
    const go = () => {
      const n = document.getElementById('dnm').value.trim();
      if (!n) return;
      const id = 'd' + (uid++);
      dirs.push({id, p:adding.parent, type:adding.type, name:n,
        path: adding.type === 'entry' ? document.getElementById('dpt').value.trim() : '',
        note: adding.type === 'entry' ? document.getElementById('dnt').value.trim() : '',
        order: dirChildren(adding.parent).length, deletedAt:null, delVia:null});
      if (adding.type === 'entry') selDir = id;
      adding = null; drawDirs();
    };
    da.addEventListener('click', go);
    document.getElementById('dcancel').addEventListener('click', () => { adding = null; drawDirs(); });
    ['dnm','dpt','dnt'].forEach(i => { const el = document.getElementById(i);
      if (el) el.addEventListener('keydown', e => {
        if (e.key === 'Enter') go();
        if (e.key === 'Escape'){ e.stopPropagation(); adding = null; drawDirs(); }
      }); });
  }

  tree.querySelectorAll('[data-did][draggable]').forEach(n => n.addEventListener('dragstart', e => {
    dirDrag = n.dataset.did;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', n.dataset.did);
  }));
  tree.addEventListener('dragover', e => {
    if (!dirDrag) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    clearDirMark(tree);
    const t = dirDropTarget(e);
    if (t) t.classList.add('drop-' + dirDropMode(t, e));
  });
  tree.addEventListener('drop', e => {
    if (!dirDrag) return;
    e.preventDefault();
    const t = dirDropTarget(e);
    const src = dirs.find(x => x.id === dirDrag);
    if (t && src){
      if (t.dataset.cd !== undefined && !t.dataset.did){
        const dest = t.dataset.cd === '' ? null : t.dataset.cd;
        if (dest !== src.id && !descendants(src.id).some(x => x.id === dest)) src.p = dest;
      } else {
        const tgt = dirs.find(x => x.id === t.dataset.did);
        if (tgt && tgt.id !== src.id && !descendants(src.id).some(x => x.id === tgt.id)){
          const mode = dirDropMode(t, e);
          if (dirSort !== 'manual') { dirReindex(); dirSort = 'manual'; }
          if (mode === 'into'){
            src.p = tgt.id; expanded.add(tgt.id);
            dirChildren(tgt.id).filter(x => x.id !== src.id).concat([src]).forEach((x,i) => x.order = i);
          } else {
            src.p = tgt.p;
            const arr = dirChildren(tgt.p).filter(x => x.id !== src.id);
            let at = arr.findIndex(x => x.id === tgt.id);
            if (at < 0) at = arr.length;
            arr.splice(mode === 'after' ? at + 1 : at, 0, src);
            arr.forEach((x,i) => x.order = i);
          }
        }
      }
      dirReindex();
    }
    dirDrag = null; clearDirMark(tree); drawDirs();
  });
  tree.addEventListener('dragend', () => { dirDrag = null; clearDirMark(tree); });
}

function drawDirDetail(){
  const box = document.getElementById('ddet');
  const d = dirs.find(x => x.id === selDir && !x.deletedAt);
  if (!d){ box.innerHTML = '<div class="empty">登録したパスを選ぶと詳細が出る</div>'; return; }

  if (dirEdit === d.id){
    box.innerHTML = `
      <div class="crumb">${dirPath(d)}</div>
      <div class="dtitle">編集</div>
      <div class="k">name</div><input type="text" id="edn" class="pathbox" value="${esc(d.name||'')}">
      ${d.type === 'entry' ? `<div class="k">path</div><input type="text" id="edp" class="pathbox" value="${esc(d.path||'')}">` : ''}
      <div class="k">note</div><input type="text" id="edt" class="pathbox" value="${esc(d.note||'')}">
      <div style="display:flex;gap:6px;margin-top:4px">
        <button class="btn sm pri" id="edsave">保存</button>
        <button class="btn sm" id="edcancel">やめる</button></div>`;
    const save = () => {
      const n = document.getElementById('edn').value.trim();
      if (!n) return document.getElementById('edn').focus();
      d.name = n;
      const pv = document.getElementById('edp'); if (pv) d.path = pv.value.trim();
      d.note = document.getElementById('edt').value.trim();
      dirEdit = null; drawDirs();
    };
    document.getElementById('edsave').addEventListener('click', save);
    document.getElementById('edcancel').addEventListener('click', () => { dirEdit = null; drawDirs(); });
    ['edn','edp','edt'].forEach(i => { const el = document.getElementById(i);

      <select id="dmove" class="sortsel" style="flex:1">

        <option value=""${d.p===null?' selected':''}>ルート</option>
        ${dirs.filter(x => x.type==='folder' && !x.deletedAt).map(f =>
          `<option value="${f.id}"${d.p===f.id?' selected':''}>${dirPath(f)==='ルート'?'':dirPath(f)+' / '}${esc(f.name)}</option>`).join('')}

    ${d.path ? (isUrl(d.path)

         <button class="btn" id="cp">URLをコピー</button></div>`
      : '<button class="btn" id="cp">パスをコピー</button>') : ''}`;

  const de = document.getElementById('dEdit');
  if (de) de.addEventListener('click', () => { dirEdit = d.id; drawDirs(); });
