function isUrl(v){ return /^https?:\/\//i.test((v||'').trim()); }
function dirColor(d){
  let cur = d, guard = 0;
  while (cur && guard++ < 30){
    if (cur.pid){
      const p = parents.find(x => x.id === cur.pid);
      if (p) return p.color;
    }
    cur = dirs.find(x => x.id === cur.p);
  }
  return null;
}
function dirPath(d){
  const names = [];
  let cur = dirs.find(x => x.id === d.p);
  while (cur){ names.unshift(cur.name); cur = dirs.find(x => x.id === cur.p); }
  return names.length ? names.join(' / ') : 'ルート';
}


function drawClock(){
  const n = now(), w = ['日','月','火','水','木','金','土'][n.getDay()];
  document.getElementById('clock').textContent = `${n.getMonth()+1}/${n.getDate()}(${w})` + (offset ? `  ${offset>0?'+':''}${offset}日` : '');
}

/* ---------- 省略された文字をホバーで送る ---------- */
const MARQUEE_SEL = '.ch-t,.stt,.wt .t,.now-t,.par-t,.en,.fn,.ppeek,.sdchip,.arow .t,.dtitle';
let mqRaf = null, mqEl = null, mqTimer = null;

function mqStop(){
  if (mqRaf) cancelAnimationFrame(mqRaf);
  if (mqTimer) clearTimeout(mqTimer);
  mqRaf = mqTimer = null;
  if (mqEl){ mqEl.scrollLeft = 0; mqEl.classList.remove('mq-on'); mqEl = null; }
}
function mqStart(el){
  const over = el.scrollWidth - el.clientWidth;
  if (over <= 2) return;
  mqStop();
  mqEl = el;
  el.classList.add('mq-on');
  el.scrollLeft = 0;
  const speed = 42;
  const run = () => {
    let t0 = null;
    const step = t => {
      if (!mqEl) return;
      if (t0 === null) t0 = t;
      const x = Math.min(over, (t - t0) / 1000 * speed);
      mqEl.scrollLeft = x;
      if (x < over) mqRaf = requestAnimationFrame(step);
      else mqTimer = setTimeout(() => {
        if (!mqEl) return;
        mqEl.scrollLeft = 0;
        mqTimer = setTimeout(run, 500);
      }, 900);
    };
    mqTimer = setTimeout(() => { mqRaf = requestAnimationFrame(step); }, 350);
  };
  run();
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest ? e.target.closest(MARQUEE_SEL) : null;
  if (!el){ if (mqEl && !mqEl.contains(e.target)) mqStop(); return; }
  if (el === mqEl) return;
  mqStart(el);
});
document.addEventListener('mouseout', e => {
  if (mqEl && e.target.closest && e.target.closest(MARQUEE_SEL) === mqEl){
    const to = e.relatedTarget;
    if (!to || !mqEl.contains(to)) mqStop();
  }
});

function drawSettings(){
  const box = document.getElementById('cfgBody');
  box.innerHTML = SETTINGS_DEF.map(g => `<div class="cfgg">
    <div class="cfggt">${esc(g.group)}</div>
    ${g.items.map(i => {
      const v = cfgDraft[i.key];
      let ctl;
      if (i.type === 'bool')
        ctl = `<label class="sw"><input type="checkbox" data-ck="${i.key}"${v?' checked':''}><span></span></label>`;
      else if (i.type === 'select')
        ctl = `<select class="sortsel" data-ck="${i.key}">${i.options.map(([ov,ol]) =>
          `<option value="${ov}"${String(ov)===String(v)?' selected':''}>${esc(ol)}</option>`).join('')}</select>`;
      else
        ctl = `<input type="text" class="pathbox cfgtxt" data-ck="${i.key}" value="${esc(v)}">`;
      return `<div class="cfgr"><div class="cfgl"><div class="cfgn">${esc(i.label)}</div>
        ${i.hint ? `<div class="cfgh2">${esc(i.hint)}</div>` : ''}</div>${ctl}</div>`;
    }).join('')}
  </div>`).join('');

  box.querySelectorAll('[data-ck]').forEach(el => el.addEventListener('change', () => {
    const k = el.dataset.ck;
    const def = SETTINGS_DEF.flatMap(g => g.items).find(i => i.key === k);
    let v;
    if (def.type === 'bool') v = el.checked;
    else if (def.type === 'select') v = isNaN(+el.value) ? el.value : +el.value;
    else v = el.value;
    cfgDraft[k] = v;
    markDirty();
  }));
}

function cfgDirty(){
  if (!cfgDraft) return false;
  return SETTINGS_DEF.flatMap(g => g.items)
    .some(i => String(cfgDraft[i.key]) !== String(setting(i.key)));
}
function markDirty(){
  const d = cfgDirty();
  const b = document.getElementById('cfgSave');
  if (b){ b.disabled = !d; b.textContent = d ? '設定を保存' : '保存済み'; }
  const n = document.getElementById('cfgNote');
  if (n) n.style.opacity = d ? '1' : '0';
}
function applySettings(){
  const before = setting('startCollapsed');
  settings = Object.assign({}, settings, cfgDraft);
  scheduleSave();
  if (setting('startCollapsed') !== before && window.applyStartupSettings){
    window.applyStartupSettings();
  }
  render();
  markDirty();
}
function hardClose(){
  cfgDraft = null;

}

function openSettings(){

function fitHeader(){
  const hd = document.querySelector('header');
  if (!hd) return;
  const brand = hd.querySelector('.brand'), bar = hd.querySelector('.hdr');
  if (!brand || !bar) return;
  const levels = ['', 'lv1', 'lv2', 'lv3', 'lv4'];

    hd.className = lv;

  }

function fitHeights(){
  const top = document.getElementById('top');
  if (!top) return;
  const wrapEl = document.querySelector('.mxwrap');
  if (window.innerWidth <= 1060){
    top.style.height = '';
    if (wrapEl){
      const side = Math.min(wrapEl.clientWidth || 320, Math.max(240, window.innerHeight * 0.55));
      wrapEl.style.height = side + 'px';
    }
    return;
  }
  if (wrapEl) wrapEl.style.height = '';

  const panel = top.querySelector('.panel');
  const wrap = document.querySelector('.mxwrap');
  const cap = Math.max(420, window.innerHeight - 96);

  let h;
  if (panel && wrap){
    const chrome = panel.offsetHeight - wrap.offsetHeight;
    const side = Math.max(240, panel.clientWidth - 20);
    h = Math.min(cap, Math.max(430, side + chrome));
  } else {
    h = Math.min(cap, 760);
  }
  top.style.height = h + 'px';
}

/* ---------- 永続化：File System Access + localStorage ---------- */
const INBOX = '__inbox';
const LS_KEY = 'quadra.v1';
let fileHandle = null, pendingHandle = null, lastWrite = 0, saveTimer = null, loading = true, lastSavedAt = 0;

function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('quadra-fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(v){
  try{ const db = await idb(); const t = db.transaction('h','readwrite'); t.objectStore('h').put(v,'file'); }catch(e){}
}
async function idbGet(){
  try{
    const db = await idb();
    return await new Promise(res => {
      const q = db.transaction('h','readonly').objectStore('h').get('file');
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);
    });
  }catch(e){ return null; }
}

function snapshot(){ lastSavedAt = Date.now(); return {v:1, savedAt:lastSavedAt, uid, parents, kids, dirs, sortMode, dirSort, dirView, settings, expanded:[...expanded]}; }
function restore(d){
  if (!d) return false;
  parents = d.parents || []; kids = d.kids || []; dirs = d.dirs || [];
  kids.forEach(k => { if (!k.recv) k.recv = k.since || k.doneAt || today(); });
  uid = d.uid || 1;
  if (d.sortMode) sortMode = d.sortMode;
  if (d.dirSort) dirSort = d.dirSort;
  if (d.dirView) dirView = d.dirView;
  settings = Object.assign(defaultSettings(), d.settings || {});
  if (Array.isArray(d.expanded)) expanded = new Set(d.expanded);
  const ss = document.getElementById('sortSel'); if (ss) ss.value = sortMode;
  const ds = document.getElementById('dirSort'); if (ds) ds.value = dirSort;
  lastSavedAt = d.savedAt || 0;
  return true;
}

function setStatus(cls, tx){
  const el = document.getElementById('saveSt');
  el.className = 'save-st ' + cls;
  document.getElementById('saveTx').textContent = tx;
}

function scheduleSave(){
  if (loading) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 600);
}
async function saveNow(){
  const data = snapshot();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if (!fileHandle){ setStatus('local','ブラウザ内のみ'); return; }
  try{
    setStatus('busy','保存中');
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(data, null, 1));
    await w.close();
    lastWrite = Date.now();
    setStatus('ok', fileHandle.name);
  }catch(e){
    setStatus('local','ファイル書込不可');
  }
}

async function resumeFile(){
  if (!pendingHandle) return false;
  try{
    const perm = await pendingHandle.requestPermission({mode:'readwrite'});
    if (perm !== 'granted'){ setStatus('local', pendingHandle.name + ' · 許可待ち'); return false; }
    fileHandle = pendingHandle; pendingHandle = null;
    const d = await readFile(fileHandle);
    if (d && d.savedAt >= lastSavedAt){
      restore(d);
      loading = true; render(); drawDirs(); loading = false;
    }
    setStatus('ok', fileHandle.name);
    return true;
  }catch(e){
    setStatus('local','ファイル書込不可');
    return false;
  }
}

async function linkFile(){
  if (pendingHandle && await resumeFile()) return;
  if (!window.showSaveFilePicker){
    alert('このブラウザはファイル保存に対応していない。ChromeかEdgeで開く。');
    return;
  }
  try{
    const h = await window.showSaveFilePicker({
      suggestedName:'quadra.json',
      types:[{description:'Quadra data', accept:{'application/json':['.json']}}]
    });
    fileHandle = h;
    await idbSet(h);
    const f = await h.getFile();
    const txt = await f.text();
    if (txt.trim()){
      if (confirm('選んだファイルにデータがある。読み込んで置き換える\n（キャンセルすると今の内容で上書き）')){
        restore(JSON.parse(txt)); render(); drawDirs();
      }
    }
    await saveNow();
  }catch(e){ /* キャンセル */ }
}

async function readFile(h){
  const f = await h.getFile();
  const t = await f.text();
  return t.trim() ? JSON.parse(t) : null;
}

async function initStore(){
  const h = await idbGet();
  if (h){
    try{
      const perm = await h.queryPermission({mode:'readwrite'});
      if (perm === 'granted'){
        fileHandle = h;
        const d = await readFile(h);
        if (d) restore(d);
        setStatus('ok', h.name);
      } else {
        pendingHandle = h;
        setStatus('local', h.name + ' · 許可待ち');
        const ls = localStorage.getItem(LS_KEY);
        if (ls) restore(JSON.parse(ls));
      }
    }catch(e){
      setStatus('local','ブラウザ内のみ');
      const ls = localStorage.getItem(LS_KEY);
      if (ls) restore(JSON.parse(ls));
    }
  } else {
    const ls = localStorage.getItem(LS_KEY);
    if (ls){ restore(JSON.parse(ls)); setStatus('local','ブラウザ内のみ'); }
    else setStatus('', '未接続');
  }
  loading = false;
}

async function checkExternal(){
  if (!fileHandle || loading) return;
  try{
    const f = await fileHandle.getFile();
    if (f.lastModified <= lastWrite + 1500) return;
    const d = await readFile(fileHandle);
    if (d && d.savedAt > lastSavedAt){
      restore(d);
      loading = true; render(); drawDirs(); loading = false;
      lastWrite = f.lastModified;
      setStatus('ok', fileHandle.name + ' · 再読込');
    }
  }catch(e){}
}

function exportData(){
  const b = new Blob([JSON.stringify(snapshot(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = `quadra-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if (!confirm('現在の内容を置き換える')) return;
      restore(d); render(); drawDirs(); saveNow();
    }catch(e){ alert('読み込めなかった'); }
  };
  r.readAsText(file);
}

window.resumeFile = resumeFile;
window.storeState = () => ({pending: !!pendingHandle, linked: !!fileHandle});
document.getElementById('linkBtn').addEventListener('click', linkFile);
document.getElementById('expBtn').addEventListener('click', exportData);
document.getElementById('impBtn').addEventListener('click', () => document.getElementById('impFile').click());
document.getElementById('impFile').addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
window.addEventListener('focus', checkExternal);
window.addEventListener('beforeunload', () => { if (saveTimer){ clearTimeout(saveTimer); } });


(async () => {
  await initStore();
  fitHeader(); fitHeights(); drawDirs(); render();
  if (window.applyStartupSettings) window.applyStartupSettings();
  if (window.refreshSummary) window.refreshSummary();
})();

(function(){
  const box = document.getElementById('login'),
        load = document.getElementById('lload'), bar = document.getElementById('lbar'),
        btn = document.getElementById('lbtn'), sum = document.getElementById('lsum');
  let locked = true, idleTimer = null;


  function summary(){
    const open = kids.filter(k => !k.done && !k.arch).length;
    const nowN = kids.filter(k => k.now && !k.done).length;
    const wait = kids.filter(k => k.waiting && !k.done && !k.arch).length;
    const soon = kids.filter(k => !k.done && !k.arch && k.due && daysLeft(k) !== null && daysLeft(k) <= 1).length;
    const hy = now().getFullYear();
    const note = hy >= HOLIDAY_CHECKED_UNTIL
      ? `<div class="r warn"><span>祝日データ</span><b>要確認</b></div>` : '';
    const hn = holidayName(now());
    const todayNote = hn ? `<div class="r"><span>本日</span><b>${hn}</b></div>` : '';
    sum.innerHTML = todayNote + `<div class="r"><span>未完了</span><b>${open}</b></div>
      <div class="r"><span>本日まで</span><b>${soon}</b></div>
      <div class="r"><span>取り組み中</span><b>${nowN}</b></div>
      <div class="r"><span>相手待ち</span><b>${wait}</b></div>` + note;
  }

  const say = t => {
    const m = document.getElementById('lmsg');
    m.style.opacity = 0;
    setTimeout(() => { m.textContent = t; m.style.opacity = 1; }, 140);
  };
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function enter(){
    if (!locked) return;
    btn.disabled = true;
    load.classList.add('on');

    if (window.storeState && window.storeState().pending){
      say('保存ファイルへの接続を確認中');
      await wait(320);
      const ok = window.resumeFile ? await window.resumeFile() : false;
      say(ok ? '保存ファイルを読み込みました' : 'ブラウザ内の記録で起動します');
      await wait(520);
    } else if (window.storeState && window.storeState().linked){
      say('保存ファイルを読み込み中');
      await wait(380);
    } else {
      say('ブラウザ内の記録を確認中');
      await wait(320);
    }

    say('画面を組み立て中');
    if (window.applyStartupSettings) window.applyStartupSettings();
    requestAnimationFrame(() => bar.classList.add('run'));
    await wait(700);

    document.getElementById('app').classList.add('in');
    box.classList.add('gone');
    locked = false;
    btn.disabled = false;
    load.classList.remove('on');
    bar.classList.remove('run');
    document.getElementById('lmsg').textContent = '読み込み中';
    fitHeights();
    summary();
    resetIdle();
  }

  function lock(){
    if (locked) return;
    clearTimeout(idleTimer);
    locked = true;
    summary();
    btn.textContent = '再開する';
    document.getElementById('app').classList.remove('in');
    box.classList.remove('gone');
  }

  function resetIdle(){
    if (locked) return;
    clearTimeout(idleTimer);
    const m = setting('lockAfter');
    if (!m) return;
    idleTimer = setTimeout(lock, m * 60000);
  }

  btn.addEventListener('click', enter);
  document.addEventListener('keydown', e => {
    if (locked && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); enter(); }
    else if (!locked && e.key === 'Escape' && e.shiftKey) lock();
    else resetIdle();
  });
  ['mousemove','click','wheel','touchstart'].forEach(ev =>
    document.addEventListener(ev, resetIdle, {passive:true}));
  document.getElementById('lockBtn').addEventListener('click', lock);

  window.refreshSummary = summary;
  summary();
})();
