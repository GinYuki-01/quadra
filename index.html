        <button class="btn sm" id="pcancel">やめる</button></div>`
    : `<button class="btn sm" id="pnew" style="margin-top:2px">＋ 親タスク</button>`;

  el.innerHTML = h;
  requestAnimationFrame(fitHeights);
  bindGroups(el);

  el.querySelectorAll('[data-p]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.p;
    openAdd = openAdd === id && !addGroup ? null : id; addGroup = null; editP = null; editK = null; openStep = null; drawTasks();
    const i = document.getElementById('ni'); if (i) i.focus();
  }));
  el.querySelectorAll('[data-foldp]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.foldp;
    if (e.altKey){
      // Unity の Hierarchy と同じく、Alt なら中の施策もまとめて開閉
      const shut = !collapsed.has(id);
      shut ? collapsed.add(id) : collapsed.delete(id);
      const p = parents.find(x => x.id === id);
      (p && p.groups || []).forEach(g => shut ? collapsedG.add(g.id) : collapsedG.delete(g.id));
    } else {
      collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    }
    drawTasks();
  }));
  el.querySelectorAll('[data-ep]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.ep;
    editP = editP === id ? null : id; editK = null; openAdd = null; drawTasks();
    const i = document.getElementById('ep'); if (i){ i.focus(); i.select(); }
  }));
  el.querySelectorAll('[data-ek]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.ek;
    editK = editK === id ? null : id; editP = null; openStep = null; drawTasks();
    const i = document.getElementById('ek'); if (i){ i.focus(); i.select(); }
  }));
  el.querySelectorAll('[data-step]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.step;
    openStep = openStep === id ? null : id; editK = null; editP = null; drawTasks();
    const i = document.getElementById('si'); if (i) i.focus();
  }));
  el.querySelectorAll('[data-sttog]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.sttog;
    kids.forEach(k => (k.steps||[]).forEach(st => { if (st.id === id){ st.done = !st.done; if (st.done) st.now = false; } }));
    render();
  }));
  el.querySelectorAll('[data-stwait]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.stwait;
    kids.forEach(k => (k.steps||[]).forEach(st => {
      if (st.id !== id) return;
      st.waiting = !st.waiting;
      st.since = st.waiting ? (st.since || today()) : null;
    }));
    render();
  }));
  el.querySelectorAll('[data-stnow]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const f = nowItem(b.dataset.stnow);
    if (f) setNow(f.st.id, !f.st.now);
  }));
  el.querySelectorAll('[data-stmore]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.stmore;
    stepsOpen.has(id) ? stepsOpen.delete(id) : stepsOpen.add(id);
    drawTasks();
  }));
  el.querySelectorAll('[data-stedit]').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    editStep = editStep === n.dataset.stedit ? null : n.dataset.stedit;
    drawTasks();
    const i = document.getElementById('se'); if (i){ i.focus(); i.select(); }
  }));
  const se = document.getElementById('se');
  if (se){
    const save = () => {
      const t = se.value.trim();
      if (!t) return se.focus();
      kids.forEach(k => (k.steps||[]).forEach(st => { if (st.id === editStep) st.text = t; }));
      editStep = null; render();
    };
    se.addEventListener('keydown', e => {
      if (e.key === 'Enter') save();
      if (e.key === 'Escape'){ e.stopPropagation(); editStep = null; drawTasks(); }
    });
    se.addEventListener('blur', save);
  }
  el.querySelectorAll('[data-stdel]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.stdel;
    kids.forEach(k => { if (k.steps) k.steps = k.steps.filter(st => st.id !== id); });
    render();
  }));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.del, n = kidsOf(id).length;
    if (n && !confirm(`子タスク${n}件ごと削除する`)) return;
    parents = parents.filter(x => x.id !== id);
    kids = kids.filter(k => k.parent !== id);
    if (openAdd === id) openAdd = null;
    reindex(); render();
  }));
  el.querySelectorAll('[data-delk]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    kids = kids.filter(k => k.id !== b.dataset.delk);
    reindex(); render();
  }));
  el.querySelectorAll('[data-tog]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    toggleDone(kids.find(x => x.id === b.dataset.tog));
    render();
  }));
  el.querySelectorAll('[data-now]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const k = kids.find(x => x.id === b.dataset.now);
    setNow(k.id, !k.now);
  }));

  bindDrag(el);

  const sadd = document.getElementById('sadd');
  if (sadd){
    const go = () => {
      const inp = document.getElementById('si');
      const t = inp.value.trim();
      if (!t) return inp.focus();
      const k = kids.find(x => x.id === openStep);
      k.steps = k.steps || [];
      const w = document.getElementById('sw').checked;
      k.steps.push({id:'s'+(uid++), text:t, done:false, waiting:w, since:w ? today() : null});
      render();
      const i = document.getElementById('si'); if (i) i.focus();
    };
    sadd.addEventListener('click', go);
    document.getElementById('si').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); openStep = null; drawTasks(); }
    });
  }

  const ekm = document.getElementById('ekm');
  if (ekm) ekm.addEventListener('input', e => document.getElementById('ekmv').textContent = e.target.value);

  const rf = document.getElementById('rf');
  if (rf){
    const k = kids.find(x => x.id === editK);
    const opt = document.getElementById('ropt');
    const drawOpt = f => {
      const r = (k && k.rep) || {};
      if (f === 'weekly') opt.innerHTML = `<select id="rv">${WD.map((w,i) =>
        `<option value="${i}"${(r.wd !== undefined ? r.wd : now().getDay())===i?' selected':''}>${w}曜</option>`).join('')}</select>`;
      else if (f === 'monthly') opt.innerHTML = `<select id="rv">${Array.from({length:31},(_,i)=>i+1).map(d =>
        `<option value="${d}"${(r.dm !== undefined ? r.dm : now().getDate())===d?' selected':''}>${d}日</option>`).join('')}</select>`;
      else if (f === 'bizday') opt.innerHTML = `<select id="rv">${
        Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}"${(r.n||1)===n?' selected':''}>第${n}営業日</option>`).join('')
        }<option value="-1"${r.n===-1?' selected':''}>最終営業日</option></select>`;
      else if (f === 'yearly') opt.innerHTML = `<input type="date" id="rv" value="${r.mo ?
        `${now().getFullYear()}-${String(r.mo).padStart(2,'0')}-${String(r.dm).padStart(2,'0')}` : today()}">`;
      else opt.innerHTML = '';
    };
    drawOpt(rf.value);
    rf.addEventListener('change', () => drawOpt(rf.value));
  }

  const eksave = document.getElementById('eksave');
  if (eksave){
    const go = () => {
      const k = kids.find(x => x.id === editK);
      const t = document.getElementById('ek').value.trim();
      if (!t) return document.getElementById('ek').focus();
      const w = document.getElementById('ekw').checked;
      k.title = t;
      const dd = readDue('ekd');
      if (dd.due !== k.due || dd.dueK !== (k.dueK || null)){ k.due = dd.due; k.dueK = dd.dueK; }
      k.recv = document.getElementById('ekr').value || k.recv || today();
      k.imp = +document.getElementById('ekm').value;
      if (w && !k.waiting) k.since = today();
      if (!w) k.since = null;
      k.waiting = w;
      k.someday = document.getElementById('eksd').checked;
      const np = document.getElementById('ekp').value;
      const eg = document.getElementById('ekg');
      if (eg) k.group = eg.value || null;
      if (np !== k.parent){ k.parent = np; k.order = 9999; k.group = null; }
      const f = document.getElementById('rf').value;
      if (!f){ k.rep = null; k.nextAt = null; }
      else {
        const v = document.getElementById('rv');
        const r = {freq:f};
        if (f === 'weekly')  r.wd = +v.value;
        if (f === 'monthly') r.dm = +v.value;
        if (f === 'bizday')  r.n  = +v.value;
        if (f === 'yearly'){ const dt = atDayStart(v.value); r.mo = dt.getMonth()+1; r.dm = dt.getDate(); }
        k.rep = r; k.nextAt = firstOccurrence(r);
        if (!k.due) k.due = k.nextAt;
      }
      editK = null; reindex(); render();
    };
    eksave.addEventListener('click', go);
    document.getElementById('ek').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); editK = null; drawTasks(); }
    });
    document.getElementById('ekcancel').addEventListener('click', () => { editK = null; drawTasks(); });
  }

  const epsave = document.getElementById('epsave');
  if (epsave){
    const go = () => {
      const p = parents.find(x => x.id === editP);
      const t = document.getElementById('ep').value.trim();
      if (!t) return document.getElementById('ep').focus();
      p.title = t; editP = null; render();
    };
    epsave.addEventListener('click', go);
    document.getElementById('ep').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); editP = null; drawTasks(); }
    });
    document.getElementById('epcancel').addEventListener('click', () => { editP = null; drawTasks(); });
  }

  const nm = document.getElementById('nm');
  if (nm) nm.addEventListener('input', e => document.getElementById('nmv').textContent = e.target.value);

  const nrf = document.getElementById('nrf');
  if (nrf){
    const opt = document.getElementById('nropt');
    const drawOpt = f => {
      if (f === 'weekly') opt.innerHTML = `<select id="nrv">${WD.map((w,i) =>
        `<option value="${i}"${now().getDay()===i?' selected':''}>${w}曜</option>`).join('')}</select>`;
      else if (f === 'monthly') opt.innerHTML = `<select id="nrv">${Array.from({length:31},(_,i)=>i+1).map(d =>
        `<option value="${d}"${now().getDate()===d?' selected':''}>${d}日</option>`).join('')}</select>`;
      else if (f === 'bizday') opt.innerHTML = `<select id="nrv">${
        Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}">第${n}営業日</option>`).join('')
        }<option value="-1">最終営業日</option></select>`;
      else if (f === 'yearly') opt.innerHTML = `<input type="date" id="nrv" value="${today()}">`;
      else opt.innerHTML = '';
    };
    nrf.addEventListener('change', () => drawOpt(nrf.value));
  }

  const nadd = document.getElementById('nadd');
  if (nadd){
    const go = () => {
      const t = document.getElementById('ni').value.trim();
      if (!t) return document.getElementById('ni').focus();
      const w = document.getElementById('nw').checked;
      const dEl = document.getElementById('nd');
      let rep = null, nextAt = null, due = dEl.value || null;
      const f = document.getElementById('nrf').value;
      if (f){
        const v = document.getElementById('nrv');
        rep = {freq:f};
        if (f === 'weekly')  rep.wd = +v.value;
        if (f === 'monthly') rep.dm = +v.value;
        if (f === 'bizday')  rep.n  = +v.value;
        if (f === 'yearly'){ const dt = atDayStart(v.value); rep.mo = dt.getMonth()+1; rep.dm = dt.getDate(); }
        nextAt = firstOccurrence(rep);
        if (!due) due = nextAt;
      }
      kids.push({id:'k'+(uid++), parent:openAdd, title:t, imp:+document.getElementById('nm').value,
        due, dueK: due && dEl.dataset.k ? dEl.dataset.k : null, group: addGroup || null,
        recv: document.getElementById('nr').value || today(),
        someday: document.getElementById('nsd').checked,
        waiting:w, since:w ? today() : null,
        done:false, doneAt:null, now:false, arch:false, rep, nextAt,
        order: kidsOf(openAdd).length});
      render();
      const i = document.getElementById('ni'); if (i) i.focus();
    };
    nadd.addEventListener('click', go);
    document.getElementById('ni').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); openAdd = null; drawTasks(); }
    });
  }
  const pnew = document.getElementById('pnew');
  if (pnew) pnew.addEventListener('click', () => { addingParent = true; drawTasks(); document.getElementById('pi').focus(); });
  const padd = document.getElementById('padd');
  if (padd){
    const go = () => {
      const t = document.getElementById('pi').value.trim();
      if (!t) return;
      const id = 'p'+(uid++);
      parents.push({id, title:t, color:COLORS[parents.length % COLORS.length],
        done:false, doneAt:null, order:parents.length});
      addingParent = false; openAdd = id; render();
      const i = document.getElementById('ni'); if (i) i.focus();
    };
    padd.addEventListener('click', go);
    document.getElementById('pi').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
      if (e.key === 'Escape'){ e.stopPropagation(); addingParent = false; drawTasks(); }
    });
    document.getElementById('pcancel').addEventListener('click', () => { addingParent = false; drawTasks(); });
  }
}

let drag = null;

function bindDrag(el){
  el.querySelectorAll('[data-dragp]').forEach(n => {
    n.addEventListener('dragstart', e => {
      if (e.target !== n && e.target.closest && e.target.closest('input,select,button')) return;
      drag = {type:'p', id:n.dataset.dragp};
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', n.dataset.dragp);
    });
  });
  el.querySelectorAll('.ch[draggable]').forEach(n => {
    n.addEventListener('dragstart', e => {
      drag = {type:'k', id:n.dataset.kid, from:'list'};
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', n.dataset.kid);
      e.stopPropagation();
      dragMark(n);
    });
  });
  el.querySelectorAll('.st[draggable]').forEach(n => {
    n.addEventListener('dragstart', e => {
      if (e.target.closest && e.target.closest('input')) return;
      drag = {type:'s', id:n.dataset.stid, from:'list'};
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', n.dataset.stid);
      e.stopPropagation();
      dragMark(n);
    });
  });
  if (el._dnd) return;
  el._dnd = true;

  // 一覧の中で受け付けるか：作業中から戻す・期限ざっくり別の見出し・手動並べ替え
  const listTarget = e => {
    if (!drag) return null;
    if (drag.from === 'now') return {el, back:true};
    if (drag.type === 's') return null;
    if (drag.type === 'k' && sortMode === 'bucket'){
      const b = e.target.closest && e.target.closest('[data-bucket]');
      return b ? {el:b, bucket:b.dataset.bucket} : null;
    }
    if (drag.type === 'k' && e.target.closest){
      const g = e.target.closest('.grp-h'), ph = e.target.closest('.par-h');
      if (g) return {el:g, gid:g.closest('[data-gid]').dataset.gid};
      if (ph) return {el:ph, ungroup:ph.dataset.dragp};
    }
    if (drag.type === 'k' && sortMode !== 'manual') return null;
    return dropTarget(e);
  };
  el.addEventListener('dragover', e => {
    const t = listTarget(e);
    if (!t) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    clearDropMark(el);
    if (t.back) return;
    t.el.classList.add(t.bucket ? 'bover' : 'drop');
  });
  el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) clearDropMark(el); });
  el.addEventListener('drop', e => {
    const t = listTarget(e);
    if (!t) return;
    e.preventDefault();
    const d = drag;
    drag = null; clearDropMark(el); dragUnmark();
    if (t.back) return setNow(d.id, false);
    if (t.gid || t.ungroup){
      const k = kids.find(x => x.id === d.id), f = t.gid && groupFind(t.gid);
      if (k && f){ k.parent = f.p.id; k.group = f.g.id; collapsedG.delete(f.g.id); }
      if (k && t.ungroup){ k.parent = t.ungroup; k.group = null; }
      reindex(); return render();
    }
    if (t.bucket){
      const k = kids.find(x => x.id === d.id);
      if (k && !['later'].includes(t.bucket)){
        if (t.bucket === 'none'){ k.due = null; k.dueK = null; }
        else { k.due = roughEnd(t.bucket); k.dueK = t.bucket === 'today' ? null : t.bucket; }
      }
      return render();
    }
    if (d.type === 'p' && t.pid){
      if (sortMode !== 'manual'){
        const cur = sortedParents();
        sortMode = 'manual';
        cur.forEach((p,i) => p.order = i);
        const sel = document.getElementById('sortSel');
        if (sel) sel.value = 'manual';
      }
      movePar(d.id, t.pid);
    }
    if (d.type === 'k'){
      if (t.kid){
        const target = kids.find(x => x.id === t.kid);
        if (target && target.id !== d.id){ moveKid(d.id, target.parent, target.id); kids.find(x => x.id === d.id).group = target.group || null; }
      } else if (t.pid){
        moveKid(d.id, t.pid, null);
      }
    }
    reindex(); render();
  });
  el.addEventListener('dragend', () => { drag = null; clearDropMark(el); dragUnmark(); });
}

/* ---- 作業中（now）への出し入れ。子タスク（k…）と孫タスク＝経過（s…）の両方を扱う ---- */
function nowItem(id){
  const k = kids.find(x => x.id === id);
  if (k) return {k, it:k};
  for (const p of kids) for (const st of (p.steps || [])) if (st.id === id) return {k:p, st, it:st};
  return null;
}
function setNow(id, on){
  const f = nowItem(id);
  if (!f || f.it.done) return;
  f.it.now = on;
  render();
  if (on){
    const c = document.querySelector(`.now-c[data-nid="${id}"]`);
    if (c && !REDUCED()) c.animate([{opacity:0, transform:'translateY(4px)'}, {opacity:1, transform:'none'}], {duration:160, easing:'ease-out'});
  } else {
    const row = document.querySelector(`[data-kid="${id}"],[data-stid="${id}"]`);
    if (row){ row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); row.scrollIntoView({block:'nearest'}); }
  }
}
function completeNow(id){
  const f = nowItem(id);
  if (!f) return;
  const card = document.querySelector(`.now-c[data-nid="${id}"]`);
  const finish = () => {
    if (f.st){ f.st.done = true; f.st.now = false; }
    else toggleDone(f.k);
    render();
  };
  if (!card || REDUCED()) return finish();
  card.classList.add('leaving');
  card.querySelector('.box').classList.add('on');
  card.animate([{opacity:1}, {opacity:0}], {duration:180, delay:120, easing:'ease-in', fill:'forwards'}).onfinish = finish;
}
(function(){
  const zone = document.getElementById('nowList');
  const accepts = () => drag && (drag.type === 'k' || drag.type === 's') && drag.from === 'list';
  zone.addEventListener('click', e => {
    const d = e.target.closest('[data-nowdone]'), b = e.target.closest('[data-nback]');
    if (d) completeNow(d.dataset.nowdone);
    if (b) setNow(b.dataset.nback, false);
  });
  zone.addEventListener('keydown', e => {
    const d = e.target.closest('[data-nowdone]');
    if (d && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); completeNow(d.dataset.nowdone); }
  });
  // ホバーで広げる／戻す。高さだけ短くアニメーションさせる
  const grow = (c, on) => {
    if (c.classList.contains('open') === on) return;
    const h0 = c.offsetHeight;
    c.classList.toggle('open', on);
    const h1 = c.offsetHeight;
    if (h0 === h1 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (c._ga) c._ga.cancel();
    c._ga = c.animate([{height:h0 + 'px', overflow:'hidden'}, {height:h1 + 'px', overflow:'hidden'}],
              {duration:180, easing:'cubic-bezier(.2,.7,.3,1)'});
  };
  zone.addEventListener('mouseover', e => {
    const c = e.target.closest('.now-c');
    if (c && !drag && !c.contains(e.relatedTarget)) grow(c, true);
  });
  zone.addEventListener('mouseout', e => {
    const c = e.target.closest('.now-c');
    if (c && !c.contains(e.relatedTarget)) grow(c, false);
  });
  zone.addEventListener('dragstart', e => {
    const c = e.target.closest('.now-c');
    if (!c) return;
    drag = {type: c.dataset.nid[0] === 's' ? 's' : 'k', id:c.dataset.nid, from:'now'};
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', c.dataset.nid);
    dragMark(c);
  });
  zone.addEventListener('dragover', e => {
    if (!accepts()) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    zone.classList.add('over');
  });
  zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('over'); });
  zone.addEventListener('drop', e => {
    if (!accepts()) return;
    e.preventDefault();
    const id = drag.id;
    drag = null; dragUnmark();
    setNow(id, true);
  });
  zone.addEventListener('dragend', () => { drag = null; dragUnmark(); });
})();

/* ---- ドラッグ中の目印（札はブラウザ標準のものをそのまま使う） ---- */
const REDUCED = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let dragSrc = null;
function dragMark(src){
  dragSrc = src;
  document.body.classList.toggle('kdrag', !!(drag && drag.from === 'list'));
  requestAnimationFrame(() => { if (dragSrc === src) src.classList.add('dragging'); });
}
function dragUnmark(){
  if (dragSrc) dragSrc.classList.remove('dragging');
  dragSrc = null;
  document.body.classList.remove('kdrag');
  document.querySelectorAll('.nowzone.over').forEach(x => x.classList.remove('over'));
}

function dropTarget(e){
  const path = e.composedPath ? e.composedPath() : [];
  for (const n of path){
    if (!n.dataset) continue;
    if (drag.type === 'k' && n.dataset.kid) return {el:n, kid:n.dataset.kid};
    if (n.dataset.pid) return {el:n, pid:n.dataset.pid};
  }
  return null;
}

function clearDropMark(el){ el.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); }

function movePar(from, to){
  if (from === to) return;
  const arr = sortedParents();
  const f = arr.findIndex(p => p.id === from), t = arr.findIndex(p => p.id === to);
  arr.splice(t, 0, arr.splice(f, 1)[0]);
  arr.forEach((p, i) => p.order = i);
}
function moveKid(from, toParent, beforeId){
  const k = kids.find(x => x.id === from);
  if (!k) return;
  k.parent = toParent;
  if (sortMode !== 'manual') return;
  const arr = kidsOf(toParent).sort((a,b)=>(a.order||0)-(b.order||0));
  const cur = arr.findIndex(x => x.id === from);
  if (cur >= 0) arr.splice(cur, 1);
  const at = beforeId ? arr.findIndex(x => x.id === beforeId) : arr.length;
  arr.splice(at < 0 ? arr.length : at, 0, k);
  arr.forEach((x, i) => x.order = i);
}

function waitEntries(){
  const l = kids.filter(k => k.waiting && !k.done && !k.arch)
    .map(k => ({c:colorOf(k), t:k.title, sub:'', e:label(k), u:urgency(k)}));
  kids.filter(k => !k.done && !k.arch).forEach(k =>
    (k.steps||[]).filter(st => st.waiting && !st.done).forEach(st =>
      l.push({c:colorOf(k), t:st.text, sub:k.title, e:stepLabel(st), u:urgency(k)})));
  return l.sort((a,b) => b.u - a.u);
}
function drawWait(){
  const l = waitEntries();
  document.getElementById('waitCount').textContent = l.length || '';
  const wp = document.getElementById('waitP');
  const tg = document.getElementById('waitToggle');
  if (tg){
    tg.style.display = l.length > 3 ? '' : 'none';
    tg.textContent = waitExpand ? '折りたたむ' : `全体表示 ${l.length}`;
  }
  if (wp) wp.classList.toggle('wexp', waitExpand);
  document.getElementById('waitList').innerHTML = l.length ? l.map(x =>
    `<div class="wt"><span class="d" style="border-color:${x.c}"></span>
      <span class="t">${x.sub ? `<span class="sub">${esc(x.sub)} › </span>` : ''}${esc(x.t)}</span>
      <span class="e">${x.e}</span></div>`).join('')
    : '<div class="empty">「相手待ち」を付けたものがここに並ぶ</div>';
}

let dirDrag = null;
function dirDropTarget(e){
  const path = e.composedPath ? e.composedPath() : [];
  for (const n of path) if (n.dataset && n.dataset.did) return n;
  return null;
}
function dirDropMode(el, e){
  const d = dirs.find(x => x.id === el.dataset.did);
  const r = el.getBoundingClientRect();
  const rel = (e.clientY - r.top) / r.height;
  if (d && d.type === 'folder' && rel > 0.28 && rel < 0.72) return 'into';
  return rel <= 0.5 ? 'before' : 'after';
}
function clearDirMark(tree){
  tree.querySelectorAll('.drop-into,.drop-before,.drop-after')
    .forEach(x => x.classList.remove('drop-into','drop-before','drop-after'));
}
function dirChildren(pid){
  const arr = dirs.filter(d => d.p === pid && !d.deletedAt);
  const fFirst = (a,b) => folderFirst ? (a.type === b.type ? 0 : a.type === 'folder' ? -1 : 1) : 0;
  if (dirSort === 'manual') return arr.sort((a,b) => fFirst(a,b) || (a.order||0) - (b.order||0));
  return arr.sort((a,b) => fFirst(a,b) || a.name.localeCompare(b.name, 'ja'));
}
function trashed(){ return dirs.filter(d => d.deletedAt && !d.delVia); }
function purgeTrash(){
  const limit = new Date(now().getTime() - 30 * DAY);
  const gone = dirs.filter(d => d.deletedAt && atDayStart(d.deletedAt) < limit).map(d => d.id);
  if (gone.length) dirs = dirs.filter(d => !gone.includes(d.id) && !gone.includes(d.delVia));
}
function trashDays(d){
  return Math.max(0, 30 - Math.floor((now() - atDayStart(d.deletedAt)) / DAY));
}
function allFolders(){ return dirs.filter(d => d.type === 'folder' && !d.deletedAt); }
function dirReindex(){
  const groups = new Set(dirs.map(d => d.p));
  groups.forEach(g => dirChildren(g).forEach((d,i) => d.order = i));
}
function descendants(id){
  const out = [];
  const walk = pid => dirs.filter(d => d.p === pid && !d.deletedAt).forEach(c => { out.push(c); walk(c.id); });
  walk(id);
  return out;
}

const TRASH_VIEW = '__trash';

function dirRow(d){
  const isF = d.type === 'folder';
  const n = isF ? dirChildren(d.id).length : 0;
  return `<div class="dn ${isF ? 'folder' : 'entry'}${selDir === d.id ? ' sel' : ''}"
      data-did="${d.id}" data-type="${d.type}" draggable="true">
    ${dirColor(d) ? `<span class="dcol" style="background:${dirColor(d)}"></span>` : '<span class="dcol none"></span>'}
    <span class="${isF ? 'fn' : 'en'}${!isF && isUrl(d.path) ? ' link' : ''}">${esc(d.name)}${!isF && isUrl(d.path) ? '<span class="lmk">↗</span>' : ''}</span>
    ${isF ? `<span class="cnum">${n || ''}</span>` : ''}
    ${!isF && d.path ? `<span class="ppeek">${esc(d.path)}</span>` : ''}
    ${isF ? `<button class="x ax" data-af="${d.id}" title="フォルダを追加"><span class="axi">▤</span><span class="axl">＋フォルダ</span></button>
    <button class="x ax" data-ae="${d.id}" title="パスを追加"><span class="axi">＋</span><span class="axl">＋パス</span></button>` : ''}
    <button class="tr" data-del="${d.id}" title="ゴミ箱へ">${TRASH}</button>
    ${isF ? '<span class="cv">›</span>' : ''}
  </div>`;
}

function dirForm(depth){
  const isF = adding.type === 'folder';
  return `<div class="dform" style="margin-left:${6 + (depth || 0) * 15}px">
    <input type="text" id="dnm" placeholder="${isF ? 'フォルダ名' : '表示名'}" autocomplete="off">
    ${isF ? '' : `<input type="text" id="dpt" placeholder="パス" autocomplete="off">
    <input type="text" id="dnt" placeholder="メモ" autocomplete="off">`}
    <div style="display:flex;gap:6px">
      <button class="btn sm pri" id="dadd">追加</button>
      <button class="btn sm" id="dcancel">やめる</button></div></div>`;
}

function guides(pre, last){
  let h = pre.map(v => `<span class="gl${v ? ' v' : ''}"></span>`).join('');
  h += `<span class="el${last ? ' last' : ''}"></span>`;
  return h;
}

function treeRow(d, pre, last){
  const isF = d.type === 'folder';
  const g = guides(pre, last);
  if (!isF){
    return `<div class="dn entry${selDir === d.id ? ' sel' : ''}" data-did="${d.id}" data-type="entry" draggable="true">
      ${g}${dirColor(d) ? `<span class="dcol" style="background:${dirColor(d)}"></span>` : '<span class="dcol none"></span>'}<span class="ficon file"></span>
      <span class="en${isUrl(d.path) ? ' link' : ''}">${esc(d.name)}${isUrl(d.path) ? '<span class="lmk">↗</span>' : ''}</span>
      ${d.path ? `<span class="ppeek">${esc(d.path)}</span>` : ''}
      <button class="tr" data-del="${d.id}" title="ゴミ箱へ">${TRASH}</button></div>`;
  }
  const open = expanded.has(d.id);
  const list = dirChildren(d.id);
  let h = `<div class="dn folder" data-did="${d.id}" data-type="folder" data-fold="${d.id}" draggable="true">
    ${g}<span class="cvt">${open ? '▾' : '▸'}</span>
    ${dirColor(d) ? `<span class="dcol" style="background:${dirColor(d)}"></span>` : '<span class="dcol none"></span>'}<span class="ficon"></span>
    <span class="fn">${esc(d.name)}</span>
    <span class="cnum">${list.length || ''}</span>
    <button class="x ax" data-af="${d.id}" title="フォルダを追加"><span class="axi">▤</span><span class="axl">＋フォルダ</span></button>
    <button class="x ax" data-ae="${d.id}" title="パスを追加"><span class="axi">＋</span><span class="axl">＋パス</span></button>
    <button class="tr" data-del="${d.id}" title="ゴミ箱へ">${TRASH}</button></div>`;
  if (open){
    const sub = pre.concat([!last]);
    h += list.map((c, i) => treeRow(c, sub, i === list.length - 1 && !(adding && adding.parent === d.id))).join('');
    if (adding && adding.parent === d.id) h += dirForm(sub.length);
  }
  return h;
}

function crumbs(){
  const parts = [];
  let cur = cwd;
  while (cur && cur !== INBOX && cur !== TRASH_VIEW){
    const d = dirs.find(x => x.id === cur);
    if (!d) break;
    parts.unshift({id:d.id, name:d.name});
    cur = d.p;
  }
  let h = `<span class="cr${cwd===null?' now':''}" data-cd="">ルート</span>`;
  if (cwd === INBOX) h += `<span class="crsep">/</span><span class="cr now" data-cd="${INBOX}">未整理</span>`;
  else if (cwd === TRASH_VIEW) h += `<span class="crsep">/</span><span class="cr now" data-cd="${TRASH_VIEW}">ゴミ箱</span>`;
  else parts.forEach((x,i) => {
    h += `<span class="crsep">/</span><span class="cr${i===parts.length-1?' now':''}" data-cd="${x.id}">${esc(x.name)}</span>`;
  });
  return h;
}

function drawDirs(){
  scheduleSave();
  purgeTrash();
  const tree = document.getElementById('dtree');
  const inTrash = cwd === TRASH_VIEW;

  let h = `<div class="ph dph" style="border:none;padding:0 0 7px">
    <span class="pt">directories</span>
    <div class="vtog">
      <button class="vt${dirView==='explorer'?' on':''}" data-view="explorer">階層移動</button>
      <button class="vt${dirView==='tree'?' on':''}" data-view="tree">ツリー</button>
    </div>
    ${dirView === 'tree' ? `<button class="x foldall" id="dirFoldAll" title="Altクリックでも一括">${
      allFolders().length && allFolders().every(f => expanded.has(f.id)) ? 'すべて閉じる' : 'すべて開く'
    }</button>` : ''}
    <label class="cb ff"><input type="checkbox" id="ffChk"${folderFirst?' checked':''}> フォルダを上に</label>
    <select id="dirSort" class="sortsel">
      <option value="name"${dirSort==='name'?' selected':''}>名前順</option>
      <option value="manual"${dirSort==='manual'?' selected':''}>手動</option>
    </select></div>`;

  if (dirView === 'tree' && !inTrash){
    const inbox = dirs.filter(d => d.p === INBOX && !d.deletedAt);
    h += `<div class="inbox-h">INBOX <span class="n">${inbox.length}</span>
      <button class="x" id="quickNew">＋ とりあえず登録</button></div>`;
    if (adding && adding.parent === INBOX) h += dirForm(0);
    h += inbox.length ? inbox.map((d,i) => treeRow(d, [], i === inbox.length - 1)).join('')
       : (adding && adding.parent === INBOX ? '' : '<div class="hint">パスと名前だけ入れて後で整理</div>');
    h += '<div class="inbox-sep"></div>';
    const roots = dirChildren(null);
    h += roots.map((d,i) => treeRow(d, [], i === roots.length - 1)).join('');
    if (adding && adding.parent === null) h += dirForm(0);
    if (!roots.length && !(adding && adding.parent === null)) h += '<div class="hint">フォルダかパスを追加</div>';
    h += `<div class="dbar">
      <button class="btn sm" data-new="folder">＋ フォルダ</button>
      <button class="btn sm" data-new="entry">＋ パス</button>
      <button class="btn sm tbtn" data-cd="${TRASH_VIEW}">ゴミ箱 ${trashed().length || ''}</button>
    </div>`;
    tree.innerHTML = h;
    bindDirs(tree);
    drawDirDetail();
    return;
  }

  h += `<div class="crumbs">${crumbs()}</div>`;

  if (inTrash){
    const tl = trashed();
    h += tl.length ? tl.map(d => `<div class="dn trashrow">
      <span class="${d.type === 'folder' ? 'fn' : 'en'}">${esc(d.name)}</span>
      <span class="tleft">あと${trashDays(d)}日</span>
      <button class="x" data-restore="${d.id}">戻す</button>
      <button class="x" data-purge="${d.id}">完全削除</button></div>`).join('')
      : '<div class="hint">ゴミ箱は空</div>';
    h += `<div class="dbar"><button class="btn sm" data-cd="">ルートへ戻る</button></div>`;
    tree.innerHTML = h;
    bindDirs(tree);
    drawDirDetail();
    return;
  }

  if (cwd !== null){
    const parent = cwd === INBOX ? '' : (dirs.find(x => x.id === cwd) || {}).p || '';
    h += `<div class="dn up" data-cd="${parent}"><span class="cv">‹</span><span class="fn">上へ</span></div>`;
  }

  if (cwd === null){
    const inbox = dirs.filter(d => d.p === INBOX && !d.deletedAt);
    h += `<div class="dn folder special" data-cd="${INBOX}">
      <span class="fn">未整理</span><span class="cnum">${inbox.length || ''}</span><span class="cv">›</span></div>`;
  }

  const list = dirChildren(cwd);
  h += list.map(dirRow).join('');
  if (adding && adding.parent === cwd) h += dirForm();
  if (!list.length && !(adding && adding.parent === cwd))
    h += `<div class="hint">${cwd === INBOX ? 'とりあえず登録したものがここに入る' : 'フォルダかパスを追加'}</div>`;

  h += `<div class="dbar">
    <button class="btn sm" data-new="folder">＋ フォルダ</button>
    <button class="btn sm" data-new="entry">＋ パス</button>
    ${cwd === null ? '<button class="btn sm" id="quickNew">＋ とりあえず登録</button>' : ''}
    <button class="btn sm tbtn" data-cd="${TRASH_VIEW}">ゴミ箱 ${trashed().length || ''}</button>
  </div>`;

  tree.innerHTML = h;
  bindDirs(tree);
  drawDirDetail();
}

function bindDirs(tree){
  tree.querySelectorAll('[data-cd]').forEach(n => n.addEventListener('click', e => {
    if (e.target.closest('button.tr')) return;
    const v = n.dataset.cd;
    cwd = v === '' ? null : v;
    selDir = null; adding = null; drawDirs();
  }));
  tree.querySelectorAll('.dn.entry').forEach(n => n.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    selDir = n.dataset.did; drawDirs();
  }));
  tree.querySelectorAll('.dn.folder[data-did]').forEach(n => n.addEventListener('dblclick', () => {
    cwd = n.dataset.did; selDir = null; drawDirs();
  }));
  tree.querySelectorAll('.dn.folder[data-did] .cv').forEach(n => n.addEventListener('click', e => {
    e.stopPropagation();
    cwd = n.closest('.dn').dataset.did; selDir = null; drawDirs();
  }));

  tree.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    dirView = b.dataset.view;
    if (dirView === 'explorer') cwd = null;
    adding = null; drawDirs();
  }));
  tree.querySelectorAll('[data-fold]').forEach(n => n.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const id = n.dataset.fold, open = expanded.has(id);
    if (e.altKey){
      const ids = [id, ...descendants(id).filter(x => x.type === 'folder').map(x => x.id)];
      ids.forEach(x => open ? expanded.delete(x) : expanded.add(x));
    } else {
      open ? expanded.delete(id) : expanded.add(id);
    }
    drawDirs();
  }));

  const dfa = document.getElementById('dirFoldAll');
  if (dfa) dfa.addEventListener('click', () => {
    const all = allFolders();
    const allOpen = all.length && all.every(f => expanded.has(f.id));
    expanded = allOpen ? new Set() : new Set(all.map(f => f.id));
    drawDirs();
  });
  const ff = document.getElementById('ffChk');
  if (ff) ff.addEventListener('change', e => { folderFirst = e.target.checked; drawDirs(); });
  const ds = document.getElementById('dirSort');
  if (ds) ds.addEventListener('change', e => {
    if (e.target.value === 'manual') dirReindex();
    dirSort = e.target.value; drawDirs();
  });

  tree.querySelectorAll('[data-af],[data-ae]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.af || b.dataset.ae;
    if (dirView === 'tree') expanded.add(id); else cwd = id;
    adding = {parent:id, type: b.dataset.af ? 'folder' : 'entry'};
    drawDirs();
    const i = document.getElementById('dnm'); if (i) i.focus();
  }));
  tree.querySelectorAll('[data-new]').forEach(b => b.addEventListener('click', () => {
    adding = {parent: dirView === 'tree' ? null : cwd, type:b.dataset.new};
    drawDirs(); const i = document.getElementById('dnm'); if (i) i.focus();
  }));
  const qn = document.getElementById('quickNew');
  if (qn) qn.addEventListener('click', () => {
    cwd = INBOX; adding = {parent:INBOX, type:'entry'};
    drawDirs(); const i = document.getElementById('dnm'); if (i) i.focus();
  });

  tree.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.del, d = dirs.find(x => x.id === id);
    const sub = descendants(id);
    const msg = sub.length ? `「${d.name}」を中身${sub.length}件ごとゴミ箱に入れる` : `「${d.name}」をゴミ箱に入れる`;
    if (!confirm(msg + '\n30日後に自動で消える')) return;
    const stamp = today();
    d.deletedAt = stamp; d.delVia = null;
    sub.forEach(x => { x.deletedAt = stamp; x.delVia = id; });
    if (selDir === id || sub.some(x => x.id === selDir)) selDir = null;
    drawDirs();
  }));
  tree.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.restore;
    dirs.forEach(x => { if (x.id === id || x.delVia === id){ x.deletedAt = null; x.delVia = null; } });
    drawDirs();
  }));
  tree.querySelectorAll('[data-purge]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('完全に削除する。元に戻せない')) return;
    const id = b.dataset.purge;
    dirs = dirs.filter(x => x.id !== id && x.delVia !== id);
    drawDirs();
  }));

  const da = document.getElementById('dadd');
  if (da){
    const go = () => {
      const n = document.getElementById('dnm').value.trim();
      if (!n) return;
      const id = 'd' + (uid++);
      dirs.push({id, p:adding.parent, type:adding.type, name:n,
        path: adding.type === 'entry' ? document.getElementById('dpt').value.trim() : '',
        note: adding.type === 'entry' ? document.getElementById('dnt').value.trim() : '',
        order: dirChildren(adding.parent).length, deletedAt:null, delVia:null});
      if (adding.type === 'entry') selDir = id;
      adding = null; drawDirs();
    };
    da.addEventListener('click', go);
    document.getElementById('dcancel').addEventListener('click', () => { adding = null; drawDirs(); });
    ['dnm','dpt','dnt'].forEach(i => { const el = document.getElementById(i);
      if (el) el.addEventListener('keydown', e => {
        if (e.key === 'Enter') go();
        if (e.key === 'Escape'){ e.stopPropagation(); adding = null; drawDirs(); }
      }); });
  }

  tree.querySelectorAll('[data-did][draggable]').forEach(n => n.addEventListener('dragstart', e => {
    dirDrag = n.dataset.did;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', n.dataset.did);
  }));
  tree.addEventListener('dragover', e => {
    if (!dirDrag) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    clearDirMark(tree);
    const t = dirDropTarget(e);
    if (t) t.classList.add('drop-' + dirDropMode(t, e));
  });
  tree.addEventListener('drop', e => {
    if (!dirDrag) return;
    e.preventDefault();
    const t = dirDropTarget(e);
    const src = dirs.find(x => x.id === dirDrag);
    if (t && src){
      if (t.dataset.cd !== undefined && !t.dataset.did){
        const dest = t.dataset.cd === '' ? null : t.dataset.cd;
        if (dest !== src.id && !descendants(src.id).some(x => x.id === dest)) src.p = dest;
      } else {
        const tgt = dirs.find(x => x.id === t.dataset.did);
        if (tgt && tgt.id !== src.id && !descendants(src.id).some(x => x.id === tgt.id)){
          const mode = dirDropMode(t, e);
          if (dirSort !== 'manual') { dirReindex(); dirSort = 'manual'; }
          if (mode === 'into'){
            src.p = tgt.id; expanded.add(tgt.id);
            dirChildren(tgt.id).filter(x => x.id !== src.id).concat([src]).forEach((x,i) => x.order = i);
          } else {
            src.p = tgt.p;
            const arr = dirChildren(tgt.p).filter(x => x.id !== src.id);
            let at = arr.findIndex(x => x.id === tgt.id);
            if (at < 0) at = arr.length;
            arr.splice(mode === 'after' ? at + 1 : at, 0, src);
            arr.forEach((x,i) => x.order = i);
          }
        }
      }
      dirReindex();
    }
    dirDrag = null; clearDirMark(tree); drawDirs();
  });
  tree.addEventListener('dragend', () => { dirDrag = null; clearDirMark(tree); });
}

function drawDirDetail(){
  const box = document.getElementById('ddet');
  const d = dirs.find(x => x.id === selDir && !x.deletedAt);
  if (!d){ box.innerHTML = '<div class="empty">登録したパスを選ぶと詳細が出る</div>'; return; }

  if (dirEdit === d.id){
    box.innerHTML = `
      <div class="crumb">${esc(dirPath(d))}</div>
      <div class="dtitle">編集</div>
      <div class="k">name</div><input type="text" id="edn" class="pathbox" value="${esc(d.name||'')}">
      ${d.type === 'entry' ? `<div class="k">path</div><input type="text" id="edp" class="pathbox" value="${esc(d.path||'')}">` : ''}
      <div class="k">note</div><input type="text" id="edt" class="pathbox" value="${esc(d.note||'')}">
      <div style="display:flex;gap:6px;margin-top:4px">
        <button class="btn sm pri" id="edsave">保存</button>
        <button class="btn sm" id="edcancel">やめる</button></div>`;
    const save = () => {
      const n = document.getElementById('edn').value.trim();
      if (!n) return document.getElementById('edn').focus();
      d.name = n;
      const pv = document.getElementById('edp'); if (pv) d.path = pv.value.trim();
      d.note = document.getElementById('edt').value.trim();
      dirEdit = null; drawDirs();
    };
    document.getElementById('edsave').addEventListener('click', save);
    document.getElementById('edcancel').addEventListener('click', () => { dirEdit = null; drawDirs(); });
    ['edn','edp','edt'].forEach(i => { const el = document.getElementById(i);
      if (el) el.addEventListener('keydown', e => {
        if (e.key === 'Enter') save();
        if (e.key === 'Escape'){ e.stopPropagation(); dirEdit = null; drawDirs(); }
      }); });
    document.getElementById('edn').focus();
    return;
  }

  box.innerHTML = `
    <div class="crumb">${esc(dirPath(d))}</div>
    <div class="dtitle">${esc(d.name)}<button class="x dedit" id="dEdit">編集</button></div>
    <div class="k">path</div>
    <input type="text" id="pathBox" class="pathbox${isUrl(d.path) ? ' link' : ''}" value="${esc(d.path || '')}" readonly>
    <div class="k">note</div><div class="dnote">${esc(d.note) || '—'}</div>
    <div class="k">紐づけ</div>
    <div style="display:flex;gap:6px;align-items:center;margin:3px 0 11px">
      <select id="dlink" class="sortsel" style="flex:1">
        <option value="">なし${dirColor(d) && !d.pid ? '（上位から継承中）' : ''}</option>
        ${parents.map(x => `<option value="${x.id}"${d.pid===x.id?' selected':''}>${esc(x.title)}</option>`).join('')}
      </select>
      <span class="dcol lg" style="background:${dirColor(d) || 'transparent'};
        ${dirColor(d) ? '' : 'border:1px dashed var(--line-2)'}"></span>
    </div>
    <div class="k">移動先</div>
    <div style="display:flex;gap:6px;align-items:center;margin:3px 0 11px">
      <select id="dmove" class="sortsel" style="flex:1">
        <option value="${INBOX}"${d.p===INBOX?' selected':''}>未整理</option>
        <option value=""${d.p===null?' selected':''}>ルート</option>
        ${dirs.filter(x => x.type==='folder' && !x.deletedAt).map(f =>
          `<option value="${f.id}"${d.p===f.id?' selected':''}>${dirPath(f)==='ルート'?'':esc(dirPath(f))+' / '}${esc(f.name)}</option>`).join('')}
      </select>
      <button class="btn sm" id="dmovego">移動</button>
    </div>
    ${d.path ? (isUrl(d.path)
      ? `<div style="display:flex;gap:6px"><a class="btn openlink" id="ol" href="${isUrl(d.path) ? esc(d.path) : '#'}" target="_blank" rel="noopener">リンクを開く</a>
         <button class="btn" id="cp">URLをコピー</button></div>`
      : '<button class="btn" id="cp">パスをコピー</button>') : ''}`;

  const de = document.getElementById('dEdit');
  if (de) de.addEventListener('click', () => { dirEdit = d.id; drawDirs(); });
  const dl = document.getElementById('dlink');
  if (dl) dl.addEventListener('change', e => { d.pid = e.target.value || null; drawDirs(); });
  const mg = document.getElementById('dmovego');
  if (mg) mg.addEventListener('click', () => {
    const v = document.getElementById('dmove').value;
    d.p = v === '' ? null : v;
    drawDirs();
  });
  const pb = document.getElementById('pathBox');
  if (pb) pb.addEventListener('focus', () => pb.select());
  const cp = document.getElementById('cp');
  if (cp){
    // 押すと「コピーしました」。カーソルがボタンの上にある間は保ち、離れたら元の文言に戻す
    const base = cp.textContent;
    let timer = null;
    cp.addEventListener('click', async () => {
      clearTimeout(timer);
      const ok = await copyText(d.path);
      cp.textContent = ok ? 'コピーしました' : '上の欄を選択してコピー';
      if (!ok && pb){ pb.focus(); pb.select(); }
      // キーボード操作などでカーソルが上にない時は、少し待って戻す
      if (!cp.matches(':hover')) timer = setTimeout(() => { cp.textContent = base; }, 1800);
    });
    cp.addEventListener('mouseleave', () => { clearTimeout(timer); cp.textContent = base; });
  }
}


function isUrl(v){ return /^https?:\/\//i.test((v||'').trim()); }
function dirColor(d){
  let cur = d, guard = 0;
  while (cur && guard++ < 30){
    if (cur.pid){
      const p = parents.find(x => x.id === cur.pid);
      if (p) return p.color;
    }
    cur = dirs.find(x => x.id === cur.p);
  }
  return null;
}
function dirPath(d){
  const names = [];
  let cur = dirs.find(x => x.id === d.p);
  while (cur){ names.unshift(cur.name); cur = dirs.find(x => x.id === cur.p); }
  return names.length ? names.join(' / ') : 'ルート';
}


/* ---------- メモ：フォルダで分類できるシンプルなメモ ---------- */
function memoKids(pid){
  const arr = memos.filter(m => m.p === pid && !m.deletedAt);
  const fs = arr.filter(m => m.type === 'folder').sort((a,b) => a.name.localeCompare(b.name, 'ja'));
  const ms = arr.filter(m => m.type === 'memo').sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  return fs.concat(ms);
}
function memoDesc(id){
  const out = [];
  const walk = pid => memos.filter(m => m.p === pid && !m.deletedAt).forEach(c => { out.push(c); walk(c.id); });
  walk(id);
  return out;
}
// ゴミ箱：Directories と同じく30日で自動で消える。中身ごと入れた分は delVia で親にまとめる
function memoTrashed(){ return memos.filter(m => m.deletedAt && !m.delVia); }
function purgeMemoTrash(){
  const limit = new Date(now().getTime() - 30 * DAY);
  const gone = memos.filter(m => m.deletedAt && atDayStart(m.deletedAt) < limit).map(m => m.id);
  if (gone.length) memos = memos.filter(m => !gone.includes(m.id) && !gone.includes(m.delVia));
}
function memoPath(pid){
  const names = [];
  let cur = memos.find(x => x.id === pid);
  while (cur){ names.unshift(cur.name); cur = memos.find(x => x.id === cur.p); }
  return names.length ? names.join(' / ') : 'ルート';
}
function memoDate(ts, full){
  if (!ts) return '';
  const d = new Date(ts);
  const md = `${d.getMonth()+1}/${d.getDate()}`;
  return full ? `${md} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : md;
}
// 何も書かれずに離れたメモは残さない
function pruneMemos(keep){
  memos = memos.filter(m => m.type !== 'memo' || m.id === keep || (m.title||'').trim() || (m.body||'').trim());
}
function newMemo(parent){
  pruneMemos(null);
  const id = 'm' + (uid++), t = Date.now();
  memos.push({id, p:parent, type:'memo', title:'', body:'', createdAt:t, updatedAt:t});
  if (parent) memoOpen.add(parent);
  selMemo = id; memoAdding = null;
  drawMemos();
  const i = document.getElementById('mTitle'); if (i) i.focus();
}

function memoForm(depth){
  return `<div class="dform" style="margin-left:${6 + depth * 15}px">
    <input type="text" id="mfn" placeholder="フォルダ名" autocomplete="off">
    <div style="display:flex;gap:6px">
      <button class="btn sm pri" id="mfadd">追加</button>
      <button class="btn sm" id="mfcancel">やめる</button></div></div>`;
}

function memoRow(m, depth){
  const pad = `style="padding-left:${8 + depth * 15}px"`;
  if (m.type === 'memo'){
    const t = (m.title||'').trim();
    return `<div class="dn mrow${selMemo === m.id ? ' sel' : ''}" data-mid="${m.id}" data-msel="${m.id}" draggable="true" ${pad}>
      <span class="ficon file"></span>
      <span class="mt${t ? '' : ' untitled'}">${t ? esc(t) : '無題'}</span>
      <span class="md">${memoDate(m.updatedAt)}</span>
      <button class="tr" data-mdel="${m.id}" title="削除">${TRASH}</button></div>`;
  }
  const open = memoOpen.has(m.id);
  const list = memoKids(m.id);
  const name = memoRename === m.id
    ? `<input type="text" class="mren" id="mren" value="${esc(m.name)}" autocomplete="off">`
    : `<span class="fn">${esc(m.name)}</span><span class="cnum">${list.length || ''}</span>`;
  let h = `<div class="dn folder mfold" data-mid="${m.id}" data-mfold="${m.id}" draggable="true" ${pad}>
    <span class="cvt">${open ? '▾' : '▸'}</span><span class="ficon"></span>${name}
    ${memoRename === m.id ? '' : `<button class="x ax" data-maf="${m.id}" title="フォルダを追加"><span class="axi">▤</span><span class="axl">＋フォルダ</span></button>
    <button class="x ax" data-mam="${m.id}" title="メモを追加"><span class="axi">＋</span><span class="axl">＋メモ</span></button>
    <button class="x" data-mren="${m.id}" title="名前を変える">名前</button>
    <button class="tr" data-mdel="${m.id}" title="削除">${TRASH}</button>`}</div>`;
  if (open){
    if (memoAdding && memoAdding.parent === m.id) h += memoForm(depth + 1);
    h += list.map(c => memoRow(c, depth + 1)).join('');
  }
  return h;
}

function drawMemos(){ drawMemoTree(); drawMemoDetail(); }

function drawMemoTree(){
  scheduleSave();
  purgeMemoTrash();
  const tree = document.getElementById('mtree');
  const n = memos.filter(m => m.type === 'memo' && !m.deletedAt).length;
  const roots = memoKids(null);
  const tn = memoTrashed().length;
  let h = `<div class="ph dph mroot" data-mroot style="border:none;padding:0 0 7px">
    <span class="pt">memos</span><span class="cnt">${n || ''}</span></div>`;
  if (memoTrash){
    const tl = memoTrashed();
    h += `<div class="crumbs"><span class="cr" data-mback>メモ</span><span class="crsep">/</span><span class="cr now">ゴミ箱</span></div>`;
    h += tl.length ? tl.map(m => `<div class="dn trashrow">
      <span class="${m.type === 'folder' ? 'fn' : 'en mt'}">${esc(m.type === 'folder' ? m.name : ((m.title||'').trim() || '無題'))}</span>
      <span class="tleft">あと${trashDays(m)}日</span>
      <button class="x" data-mrestore="${m.id}">戻す</button>
      <button class="x" data-mpurge="${m.id}">完全削除</button></div>`).join('')
      : '<div class="hint">ゴミ箱は空</div>';
    h += `<div class="dbar"><button class="btn sm" data-mback>メモへ戻る</button></div>`;
    tree.innerHTML = h;
    bindMemos(tree);
    return;
  }
  if (memoAdding && memoAdding.parent === null) h += memoForm(0);
  h += roots.map(m => memoRow(m, 0)).join('');
  if (!roots.length && !memoAdding) h += '<div class="hint">フォルダかメモを追加</div>';
  h += `<div class="dbar">
    <button class="btn sm" id="mNewF">＋ フォルダ</button>
    <button class="btn sm" id="mNewM">＋ メモ</button>
    <button class="btn sm tbtn" id="mTrash">ゴミ箱 ${tn || ''}</button></div>`;
  tree.innerHTML = h;
  bindMemos(tree);
}

function bindMemos(tree){
  tree.querySelectorAll('[data-msel]').forEach(n => n.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const id = n.dataset.msel;
    pruneMemos(id);
    selMemo = id; drawMemos();
  }));
  tree.querySelectorAll('[data-mfold]').forEach(n => n.addEventListener('click', e => {
    if (e.target.closest('button') || e.target.closest('input')) return;
    const id = n.dataset.mfold;
    memoOpen.has(id) ? memoOpen.delete(id) : memoOpen.add(id);
    drawMemoTree();
  }));
  tree.querySelectorAll('[data-mam]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); newMemo(b.dataset.mam);
  }));
  tree.querySelectorAll('[data-maf]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    memoOpen.add(b.dataset.maf);
    memoAdding = {parent:b.dataset.maf}; drawMemoTree();
    document.getElementById('mfn').focus();
  }));
  tree.querySelectorAll('[data-mback]').forEach(b => b.addEventListener('click', () => { memoTrash = false; drawMemos(); }));
  tree.querySelectorAll('[data-mrestore]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.mrestore, m = memos.find(x => x.id === id);
    // 入っていたフォルダが消えていたらルートへ戻す
    const home = memos.find(x => x.id === m.p);
    if (m.p && (!home || home.deletedAt)) m.p = null;
    memos.forEach(x => { if (x.id === id || x.delVia === id){ x.deletedAt = null; x.delVia = null; } });
    drawMemos();
  }));
  tree.querySelectorAll('[data-mpurge]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('完全に削除する。元に戻せない')) return;
    const id = b.dataset.mpurge;
    memos = memos.filter(x => x.id !== id && x.delVia !== id);
    drawMemos();
  }));
  if (memoTrash) return;
  document.getElementById('mTrash').addEventListener('click', () => {
    pruneMemos(null); memoTrash = true; memoAdding = null; memoRename = null; drawMemos();
  });
  document.getElementById('mNewM').addEventListener('click', () => newMemo(null));
  document.getElementById('mNewF').addEventListener('click', () => {
    memoAdding = {parent:null}; drawMemoTree();
    document.getElementById('mfn').focus();
  });

  const fa = document.getElementById('mfadd');
  if (fa){
    const go = () => {
      const v = document.getElementById('mfn').value.trim();
      if (!v) return;
      memos.push({id:'m' + (uid++), p:memoAdding.parent, type:'folder', name:v});
      memoAdding = null; drawMemos();
    };
    fa.addEventListener('click', go);
    document.getElementById('mfcancel').addEventListener('click', () => { memoAdding = null; drawMemoTree(); });
    document.getElementById('mfn').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) go();
      if (e.key === 'Escape'){ e.stopPropagation(); memoAdding = null; drawMemoTree(); }
    });
  }

  tree.querySelectorAll('[data-mren]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); memoRename = b.dataset.mren; drawMemoTree();
    const i = document.getElementById('mren'); i.focus(); i.select();
  }));
  const ri = document.getElementById('mren');
  if (ri){
    const f = memos.find(x => x.id === memoRename);
    const done = ok => {
      if (memoRename === null) return;
      const v = ri.value.trim();
      if (ok && v && f) f.name = v;
      memoRename = null; drawMemos();
    };
    ri.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) done(true);
      if (e.key === 'Escape'){ e.stopPropagation(); done(false); }
    });
    ri.addEventListener('blur', () => done(true));
  }

  tree.querySelectorAll('[data-mdel]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.mdel, m = memos.find(x => x.id === id);
    if (!m) return;
    const t = (m.title||'').trim();
    // 空のメモはゴミ箱を通さずに消す
    if (m.type === 'memo' && !t && !(m.body||'').trim()){
      memos = memos.filter(x => x.id !== id);
    } else {
      const sub = m.type === 'folder' ? memoDesc(id) : [];
      const name = m.type === 'folder' ? m.name : (t || '無題');
      if (!confirm(`「${name}」を${sub.length ? `中身${sub.length}件ごと` : ''}ゴミ箱に入れる\n30日後に自動で消える`)) return;
      const stamp = today();
      m.deletedAt = stamp; m.delVia = null;
      sub.forEach(x => { x.deletedAt = stamp; x.delVia = id; });
    }
    if (selMemo === id || memoDesc(id).some(x => x.id === selMemo) ||
        (memos.find(x => x.id === selMemo) || {}).deletedAt) selMemo = null;
    drawMemos();
  }));

  // ドラッグでフォルダへ移動（ルートは見出しへ落とす）
  const target = e => e.target.closest('[data-mfold],[data-mroot]');
  tree.querySelectorAll('[data-mid][draggable]').forEach(n => n.addEventListener('dragstart', e => {
    memoDrag = n.dataset.mid;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', n.dataset.mid);
  }));
  const unmark = () => tree.querySelectorAll('.drop-into').forEach(x => x.classList.remove('drop-into'));
  if (tree.dataset.bound) return;
  tree.dataset.bound = '1';
  tree.addEventListener('dragover', e => {
    if (!memoDrag) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    unmark();
    const t = target(e); if (t) t.classList.add('drop-into');
  });
  tree.addEventListener('drop', e => {
    if (!memoDrag) return;
    e.preventDefault();
    const t = target(e), src = memos.find(x => x.id === memoDrag);
    if (t && src){
      const dest = t.dataset.mfold || null;
      if (dest !== src.id && !memoDesc(src.id).some(x => x.id === dest)){
        src.p = dest;
        if (dest) memoOpen.add(dest);
      }
    }
    memoDrag = null; drawMemos();
  });
  tree.addEventListener('dragend', () => { memoDrag = null; unmark(); });
}

/* ---------- 省略された文字をホバーで送る ---------- */
const MARQUEE_SEL = '.ch-t,.stt,.wt .t,.par-t,.en,.fn,.ppeek,.sdchip,.arow .t,.dtitle';
let mqRaf = null, mqEl = null, mqTimer = null;

function mqStop(){
  if (mqRaf) cancelAnimationFrame(mqRaf);
  if (mqTimer) clearTimeout(mqTimer);
  mqRaf = mqTimer = null;
  if (mqEl){ mqEl.scrollLeft = 0; mqEl.classList.remove('mq-on'); mqEl = null; }
}
function mqStart(el){
  const over = el.scrollWidth - el.clientWidth;
  if (over <= 2) return;
  mqStop();
  mqEl = el;
  el.classList.add('mq-on');
  el.scrollLeft = 0;
  const speed = 42;
  const run = () => {
    let t0 = null;
    const step = t => {
      if (!mqEl) return;
      if (t0 === null) t0 = t;
      const x = Math.min(over, (t - t0) / 1000 * speed);
      mqEl.scrollLeft = x;
      if (x < over) mqRaf = requestAnimationFrame(step);
      else mqTimer = setTimeout(() => {
        if (!mqEl) return;
        mqEl.scrollLeft = 0;
        mqTimer = setTimeout(run, 500);
      }, 900);
    };
    mqTimer = setTimeout(() => { mqRaf = requestAnimationFrame(step); }, 350);
  };
  run();
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest ? e.target.closest(MARQUEE_SEL) : null;
  if (!el){ if (mqEl && !mqEl.contains(e.target)) mqStop(); return; }
  if (el === mqEl) return;
  mqStart(el);
});
document.addEventListener('mouseout', e => {
  if (mqEl && e.target.closest && e.target.closest(MARQUEE_SEL) === mqEl){
    const to = e.relatedTarget;
    if (!to || !mqEl.contains(to)) mqStop();
  }
});

function fitHeights(){
  const top = document.getElementById('top');
  if (!top) return;
  const wrapEl = document.querySelector('.mxwrap');
  const mxOn = leftFace === 'mx';
  if (window.innerWidth <= 1060){
    top.style.height = '';
    if (wrapEl){
      const side = Math.min(wrapEl.clientWidth || 320, Math.max(240, window.innerHeight * 0.55));
      wrapEl.style.height = side + 'px';
    }
    return;
  }
  // 上段は中身の量に合わせる。一覧が長いときは上限（画面の高さ − 余白）で止めて欄の中でスクロール
  const cap = Math.max(420, window.innerHeight - 160);
  const nowP = document.getElementById('nowP'), nowList = document.getElementById('nowList');
  const taskP = document.getElementById('taskP'), taskList = document.getElementById('taskList');
  const left = top.querySelector('.left');
  const gap = parseFloat(getComputedStyle(left).rowGap) || 0;
  // いったん高さを外して中身の自然な高さを測る（スクロール位置は戻す）
  const keep = {list:taskList.scrollTop, now:nowList.scrollTop, page:window.scrollY};
  top.style.height = '';
  let h = 360;
  if (wrapEl) wrapEl.style.height = '';
  if (mxOn && wrapEl){
    // マトリクス面は正方形が収まる高さ
    const mxP = document.getElementById('mxP');
    const side = Math.max(240, mxP.clientWidth - 20);
    const chrome = [...mxP.children].filter(c => c !== wrapEl).reduce((sum, c) => sum + c.offsetHeight, 0) + 3;
    h = Math.max(h, side + chrome);
  } else {
    const items = [...nowList.children].reduce((sum, c) => sum + c.offsetHeight, 0)
      + Math.max(0, nowList.children.length - 1) * (parseFloat(getComputedStyle(nowList).rowGap) || 0)
      + parseFloat(getComputedStyle(nowList).paddingTop) + parseFloat(getComputedStyle(nowList).paddingBottom);
    const nowH = (nowP.offsetHeight - nowList.offsetHeight) + Math.max(items, 150);
    const others = [...document.getElementById('faceNow').children].filter(c => c !== nowP)
      .reduce((sum, c) => sum + c.offsetHeight + gap, 0);
    h = Math.max(h, Math.min(nowH + others, cap));
  }
  const taskH = (taskP.offsetHeight - taskList.clientHeight) + taskList.scrollHeight;
  h = Math.max(h, Math.min(taskH, cap));
  top.style.height = Math.ceil(h) + 'px';
  taskList.scrollTop = keep.list; nowList.scrollTop = keep.now;
  if (window.scrollY !== keep.page) window.scrollTo(0, keep.page);
}

  if (REDUCED() || !col.animate){ showFace(next); return done(); }

  const ease = {duration:170, fill:'forwards'};
  col.animate([{transform:'rotateY(0)'}, {transform:'rotateY(90deg)'}], {...ease, easing:'ease-in'}).onfinish = () => {
    showFace(next);
    const a = col.animate([{transform:'rotateY(-90deg)'}, {transform:'rotateY(0)'}], {...ease, easing:'ease-out'});
    a.onfinish = () => { a.cancel(); col.getAnimations().forEach(x => x.cancel()); done(); };
  };
}

/* ---------- 永続化：File System Access + localStorage ---------- */
const INBOX = '__inbox';
const LS_KEY = 'quadra.v1';
let fileHandle = null, pendingHandle = null, lastWrite = 0, saveTimer = null, loading = true, lastSavedAt = 0;

function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('quadra-fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(v){
  try{ const db = await idb(); const t = db.transaction('h','readwrite'); t.objectStore('h').put(v,'file'); }catch(e){}
}
async function idbGet(){
  try{
    const db = await idb();
    return await new Promise(res => {
      const q = db.transaction('h','readonly').objectStore('h').get('file');
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);
    });
  }catch(e){ return null; }
}

function snapshot(){ lastSavedAt = Date.now(); return {v:1, savedAt:lastSavedAt, uid, parents, kids, dirs, memos, memoOpen:[...memoOpen], sortMode, dirSort, dirView, folderFirst, settings, leftFace, expanded:[...expanded]}; }
function restore(d){
  if (!d) return false;
  parents = d.parents || []; kids = d.kids || []; dirs = d.dirs || [];
  memos = d.memos || [];
  memoOpen = new Set(Array.isArray(d.memoOpen) ? d.memoOpen : []);
  kids.forEach(k => { if (!k.recv) k.recv = k.since || k.doneAt || today(); });
  uid = d.uid || 1;
  if (d.sortMode) sortMode = d.sortMode;
  if (d.dirSort) dirSort = d.dirSort;
  if (d.dirView) dirView = d.dirView;
  if (typeof d.folderFirst === 'boolean') folderFirst = d.folderFirst;
  settings = Object.assign(defaultSettings(), d.settings || {});
  if (Array.isArray(d.expanded)) expanded = new Set(d.expanded);
  if (d.leftFace === 'mx' || d.leftFace === 'now') showFace(d.leftFace);
  const ss = document.getElementById('sortSel'); if (ss) ss.value = sortMode;
  const ds = document.getElementById('dirSort'); if (ds) ds.value = dirSort;
  lastSavedAt = d.savedAt || 0;
  return true;
}

function setStatus(cls, tx){
  const el = document.getElementById('saveSt');
  el.className = 'save-st ' + cls;
  document.getElementById('saveTx').textContent = tx;
}

function scheduleSave(){
  if (loading) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 600);
}
async function saveNow(){
  const data = snapshot();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if (!fileHandle){ setStatus('local','ブラウザ内のみ'); return; }
  try{
    setStatus('busy','保存中');
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(data, null, 1));
    await w.close();
    lastWrite = Date.now();
    setStatus('ok', fileHandle.name);
  }catch(e){
    setStatus('local','ファイル書込不可');
  }
}

async function resumeFile(){
  if (!pendingHandle) return false;
  try{
    const perm = await pendingHandle.requestPermission({mode:'readwrite'});
    if (perm !== 'granted'){ setStatus('local', pendingHandle.name + ' · 許可待ち'); return false; }
    fileHandle = pendingHandle; pendingHandle = null;
    const d = await readFile(fileHandle);
    if (d && d.savedAt >= lastSavedAt){
      restore(d);
      loading = true; render(); drawDirs(); drawMemos(); loading = false;
    }
    setStatus('ok', fileHandle.name);
    return true;
  }catch(e){
    setStatus('local','ファイル書込不可');
    return false;
  }
}

async function linkFile(){
  if (pendingHandle && await resumeFile()) return;
  if (!window.showSaveFilePicker){
    alert('このブラウザはファイル保存に対応していない。ChromeかEdgeで開く。');
    return;
  }
  try{
    const h = await window.showSaveFilePicker({
      suggestedName:'quadra.json',
      types:[{description:'Quadra data', accept:{'application/json':['.json']}}]
    });
    fileHandle = h;
    await idbSet(h);
    const f = await h.getFile();
    const txt = await f.text();
    if (txt.trim()){
      if (confirm('選んだファイルにデータがある。読み込んで置き換える\n（キャンセルすると今の内容で上書き）')){
        restore(JSON.parse(txt)); render(); drawDirs(); drawMemos();
      }
    }
    await saveNow();
  }catch(e){ /* キャンセル */ }
}

async function readFile(h){
  const f = await h.getFile();
  const t = await f.text();
  return t.trim() ? JSON.parse(t) : null;
}

async function initStore(){
  const h = await idbGet();
  if (h){
    try{
      const perm = await h.queryPermission({mode:'readwrite'});
      if (perm === 'granted'){
        fileHandle = h;
        const d = await readFile(h);
        if (d) restore(d);
        setStatus('ok', h.name);
      } else {
        pendingHandle = h;
        setStatus('local', h.name + ' · 許可待ち');
        const ls = localStorage.getItem(LS_KEY);
        if (ls) restore(JSON.parse(ls));
      }
    }catch(e){
      setStatus('local','ブラウザ内のみ');
      const ls = localStorage.getItem(LS_KEY);
      if (ls) restore(JSON.parse(ls));
    }
  } else {
    const ls = localStorage.getItem(LS_KEY);
    if (ls){ restore(JSON.parse(ls)); setStatus('local','ブラウザ内のみ'); }
    else setStatus('', '未接続');
  }
  loading = false;
}

async function checkExternal(){
  if (!fileHandle || loading) return;
  try{
    const f = await fileHandle.getFile();
    if (f.lastModified <= lastWrite + 1500) return;
    const d = await readFile(fileHandle);
    if (d && d.savedAt > lastSavedAt){
      restore(d);
      loading = true; render(); drawDirs(); drawMemos(); loading = false;
      lastWrite = f.lastModified;
      setStatus('ok', fileHandle.name + ' · 再読込');
    }
  }catch(e){}
}

function exportData(){
  const b = new Blob([JSON.stringify(snapshot(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = `quadra-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if (!confirm('現在の内容を置き換える')) return;
      restore(d); render(); drawDirs(); drawMemos(); saveNow();
    }catch(e){ alert('読み込めなかった'); }
  };
  r.readAsText(file);
}

window.resumeFile = resumeFile;
window.storeState = () => ({pending: !!pendingHandle, linked: !!fileHandle});
document.getElementById('linkBtn').addEventListener('click', linkFile);
document.getElementById('expBtn').addEventListener('click', exportData);
document.getElementById('impBtn').addEventListener('click', () => document.getElementById('impFile').click());
document.getElementById('impFile').addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
window.addEventListener('focus', checkExternal);
window.addEventListener('beforeunload', () => { if (saveTimer){ clearTimeout(saveTimer); } });


(async () => {
  await initStore();
  fitHeader(); fitHeights(); drawDirs(); drawMemos(); render();
  if (window.applyStartupSettings) window.applyStartupSettings();
  if (window.refreshSummary) window.refreshSummary();
})();

(function(){
  const box = document.getElementById('login'),
        load = document.getElementById('lload'), bar = document.getElementById('lbar'),
        btn = document.getElementById('lbtn'), sum = document.getElementById('lsum');
  let locked = true, idleTimer = null;


  function summary(){
    const open = kids.filter(k => !k.done && !k.arch).length;
    const nowN = kids.filter(k => k.now && !k.done).length;
    const wait = waitEntries().length;
    const soon = kids.filter(k => !k.done && !k.arch && k.due && daysLeft(k) !== null && daysLeft(k) <= 2).length;
    const hy = now().getFullYear();
    const note = hy >= HOLIDAY_CHECKED_UNTIL
      ? `<div class="r warn"><span>祝日データ</span><b>要確認</b></div>` : '';
    const hn = holidayName(now());
    const todayNote = hn ? `<div class="r"><span>本日</span><b>${hn}</b></div>` : '';
    sum.innerHTML = todayNote + `<div class="r"><span>未完了</span><b>${open}</b></div>
      <div class="r"><span>本日まで</span><b>${soon}</b></div>
      <div class="r"><span>取り組み中</span><b>${nowN}</b></div>
      <div class="r"><span>相手待ち</span><b>${wait}</b></div>` + note;
  }

  const say = t => {
    const m = document.getElementById('lmsg');
    m.style.opacity = 0;
    setTimeout(() => { m.textContent = t; m.style.opacity = 1; }, 140);
  };
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function enter(){
    if (!locked) return;
    btn.disabled = true;
    load.classList.add('on');

    if (window.storeState && window.storeState().pending){
      say('保存ファイルへの接続を確認中');
      await wait(320);
      const ok = window.resumeFile ? await window.resumeFile() : false;
      say(ok ? '保存ファイルを読み込みました' : 'ブラウザ内の記録で起動します');
      await wait(520);
    } else if (window.storeState && window.storeState().linked){
      say('保存ファイルを読み込み中');
      await wait(380);
    } else {
      say('ブラウザ内の記録を確認中');
      await wait(320);
    }

    say('画面を組み立て中');
    if (window.applyStartupSettings) window.applyStartupSettings();
    requestAnimationFrame(() => bar.classList.add('run'));
    await wait(700);

    document.getElementById('app').classList.add('in');
    box.classList.add('gone');
    locked = false;
    btn.disabled = false;
    load.classList.remove('on');
    bar.classList.remove('run');
    document.getElementById('lmsg').textContent = '読み込み中';
    fitHeights();
    summary();
    resetIdle();
  }

  function lock(){
    if (locked) return;
    clearTimeout(idleTimer);
    locked = true;
    summary();
    btn.textContent = '再開する';
    document.getElementById('app').classList.remove('in');
    box.classList.remove('gone');
  }

  function resetIdle(){
    if (locked) return;
    clearTimeout(idleTimer);
    const m = setting('lockAfter');
    if (!m) return;
    idleTimer = setTimeout(lock, m * 60000);
  }

  btn.addEventListener('click', enter);
  document.addEventListener('keydown', e => {
    if (locked && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); enter(); }
    else if (!locked && e.key === 'Escape' && e.shiftKey) lock();
    else resetIdle();
  });
  ['mousemove','click','wheel','touchstart'].forEach(ev =>
    document.addEventListener(ev, resetIdle, {passive:true}));
  document.getElementById('lockBtn').addEventListener('click', lock);

  window.refreshSummary = summary;
  summary();
})();

</script>
</body>
</html>
